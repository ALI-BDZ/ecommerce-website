root = "."
tmp_dir = "tmp"

[build]
  entrypoint = "./tmp/server.exe"
  cmd = "D:\\go\\bin\\go.exe build -o ./tmp/server.exe ./cmd/web/"
  delay = 1000
  exclude_dir = ["tmp", "node_modules", ".git"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "html", "css", "js", "env"]
  kill_delay = "0s"

[log]
  time = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true
