<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>IronFuel Nutrition — Premium Supplements</title>
  <meta name="description" content="Premium supplements for serious athletes and everyday warriors."/>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>window.__i18n = window.__i18n || {};</script>
  <script src="/locales/en.js?v=2"></script>
  <script src="/locales/ar.js?v=2"></script>
  <script src="/locales/fr.js?v=2"></script>
  <script src="/js/i18n.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="font-link" href="/css/fonts.css" rel="stylesheet"/>
  <style>
    :root{
      --ff:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --ink:#0b0b10;--ink-soft:#13131f;--ink-muted:#1e1e2f;--paper:#f8f7f4;--paper-warm:#f0eeea;--paper-cool:#e8e6e3;
      --text:#0b0b10;--text-secondary:#6b6b78;--text-tertiary:#9a9aa8;--border:rgba(11,11,16,0.06);--border-strong:rgba(11,11,16,0.12);
      --accent:#5b21b6;--accent-light:#7c3aed;--accent-glow:rgba(91,33,182,0.18);--success:#059669;--white:#ffffff;
      --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:96px;--space-10:128px;
      --radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-xl:32px;--radius-pill:999px;
      --shadow-sm:0 1px 2px rgba(11,11,16,0.04);--shadow-md:0 8px 24px rgba(11,11,16,0.06);--shadow-lg:0 16px 48px rgba(11,11,16,0.10);--shadow-xl:0 24px 80px rgba(11,11,16,0.14);--shadow-glow:0 0 40px var(--accent-glow);
      --ease-out-expo:cubic-bezier(0.16,1,0.3,1);--ease-out-quart:cubic-bezier(0.25,1,0.5,1);
      --duration-fast:200ms;--duration-base:400ms;--duration-slow:700ms;
      --container:1520px;--nav-h:72px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    html,body{font-family:var(--ff);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;background:var(--paper);}
    ::selection{background:var(--accent);color:var(--white)}
    h1,h2,h3,h4{font-weight:800;letter-spacing:-0.04em;margin:0;line-height:1.1}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    [x-cloak]{display:none!important}
    .reveal{opacity:0;transform:translateY(40px);transition:opacity var(--duration-slow) var(--ease-out-expo),transform var(--duration-slow) var(--ease-out-expo)}
    .reveal.visible{opacity:1;transform:translateY(0)}
    .reveal-delay-1{transition-delay:80ms}.reveal-delay-2{transition-delay:160ms}.reveal-delay-3{transition-delay:240ms}.reveal-delay-4{transition-delay:320ms}
    
    /* Buttons */
    .btn-premium{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 32px;background:var(--ink);color:var(--white);border:none;border-radius:var(--radius-pill);font-size:14px;font-weight:700;letter-spacing:-0.01em;cursor:pointer;position:relative;overflow:hidden;transition:transform var(--duration-fast) var(--ease-out-quart),box-shadow var(--duration-fast);}
    .btn-premium::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.1) 50%,transparent 60%);transform:translateX(-100%);transition:transform 0.6s var(--ease-out-expo);}
    .btn-premium:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg),var(--shadow-glow)}
    .btn-premium:hover::before{transform:translateX(100%)}
    .btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 32px;background:transparent;color:var(--ink);border:1.5px solid var(--border-strong);border-radius:var(--radius-pill);font-size:14px;font-weight:700;cursor:pointer;transition:all var(--duration-fast) var(--ease-out-quart);}
    .btn-ghost:hover{border-color:var(--ink);background:var(--ink);color:var(--white);transform:translateY(-2px)}
    .btn-white{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 32px;background:var(--white);color:var(--ink);border:none;border-radius:var(--radius-pill);font-size:14px;font-weight:700;cursor:pointer;transition:all var(--duration-fast) var(--ease-out-quart);}
    .btn-white:hover{transform:translateY(-2px);box-shadow:var(--shadow-xl)}
    
    .container{max-width:var(--container);margin:0 auto;padding:0 var(--space-4)}
    @media(min-width:768px){.container{padding:0 var(--space-6)}}
    @media(min-width:1024px){.container{padding:0 var(--space-7)}}
    
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:var(--space-3);display:flex;align-items:center;gap:var(--space-3);}
    .eyebrow::before{content:'';display:block;width:20px;height:2px;background:currentColor;opacity:0.4}
    .eyebrow.light{color:rgba(255,255,255,0.5)}.eyebrow.light::before{background:rgba(255,255,255,0.5)}
    .price{font-weight:700;font-size:17px;letter-spacing:-0.02em}
    
    /* Navigation */
    .navbar{position:fixed;top:var(--space-3);left:var(--space-3);right:var(--space-3);z-index:100;height:var(--nav-h);border-radius:var(--radius-xl);transition:background var(--duration-base) var(--ease-out-quart),box-shadow var(--duration-base),border-color var(--duration-base);background:rgba(250,249,247,0);border:1px solid transparent;}
    .navbar.scrolled{background:rgba(250,249,247,0.85);backdrop-filter:blur(24px) saturate(1.4);border-color:var(--border);box-shadow:var(--shadow-sm);}
    .navbar-inner{max-width:var(--container);margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-5)}
    .navbar-burger{display:none;background:none;border:none;color:#fff;cursor:pointer;padding:6px;border-radius:var(--radius-sm);transition:background var(--duration-fast)}
    .navbar-burger:hover{background:rgba(255,255,255,0.12)}
    .navbar.scrolled .navbar-burger{color:var(--text)}.navbar.scrolled .navbar-burger:hover{background:var(--paper-cool)}
    .navbar-logo{display:flex;flex-direction:column;line-height:1;color:#fff;text-decoration:none;position:relative}
    .logo-sub{font-size:8px;font-weight:700;letter-spacing:0.32em;color:rgba(255,255,255,0.5);margin-top:2px}
    .navbar.scrolled .navbar-logo{color:var(--text)}.navbar.scrolled .logo-sub{color:var(--text-tertiary)}
    .navbar-links{display:flex;gap:var(--space-6);align-items:center}
    .navbar-link{font-size:13.5px;font-weight:600;letter-spacing:-0.01em;color:#fff;transition:color var(--duration-fast);position:relative;padding:4px 0;}
    .navbar-link::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--accent);transition:width var(--duration-fast) var(--ease-out-expo);}
    .navbar-link:hover{color:#fff}.navbar-link:hover::after{width:100%}
    .navbar-link.active{color:#fff}.navbar-link.active::after{width:100%}
    .navbar.scrolled .navbar-link{color:var(--text-secondary)}.navbar.scrolled .navbar-link:hover{color:var(--text)}
    .navbar-actions{display:flex;align-items:center;gap:var(--space-2)}
    .lang-switcher{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);border-radius:var(--radius-pill);padding:4px;box-shadow:0 2px 12px rgba(0,0,0,0.1);border:1px solid rgba(0,0,0,0.06);position:fixed;bottom:24px;left:24px;z-index:998;transition:transform .3s cubic-bezier(0.16,1,0.3,1),opacity .3s}
    .lang-switcher:hover{transform:scale(1.05)}
    .lang-switcher button{border:none;background:none;padding:3px;border-radius:50%;cursor:pointer;transition:transform .2s;line-height:0;display:flex;align-items:center;justify-content:center}
    .lang-switcher button img{width:22px;height:22px;border-radius:50%;object-fit:cover;transition:transform .2s}
    .lang-switcher button.active img{transform:scale(1.15);box-shadow:0 0 0 2px var(--accent)}
    .lang-switcher button:hover img{transform:scale(1.08)}
    .navbar-icon-btn{position:relative;background:none;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;transition:background var(--duration-fast),transform var(--duration-fast);}
    .navbar-icon-btn:hover{background:rgba(255,255,255,0.12);transform:translateY(-1px)}
    .navbar.scrolled .navbar-icon-btn{color:var(--text)}.navbar.scrolled .navbar-icon-btn:hover{background:var(--paper-cool)}
    .cart-count{position:absolute;top:2px;right:2px;background:var(--accent);color:var(--white);font-size:9px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);}


     /* Hero */
     .hero-wrap{position:relative}
      .hero-wrap::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:80px;background:var(--white);clip-path:ellipse(70% 100% at 50% 100%);z-index:4;pointer-events:none}
     .hero-card{overflow:hidden;position:relative;min-height:100vh;display:flex;align-items:center;background:var(--ink-soft);}

    .hero-bg{position:absolute;inset:0;width:100%;height:110%;object-fit:cover;z-index:0;opacity:0.8;transform:scale(1.04);animation:heroZoom 15s ease-out forwards}
    @keyframes heroZoom{from{transform:scale(1.08)}to{transform:scale(1.0)}}
    .hero-bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,16,0.15) 0%,rgba(11,11,16,0.55) 50%,rgba(11,11,16,0.92) 100%),linear-gradient(135deg,rgba(91,33,182,0.15) 0%,transparent 70%);z-index:1;transition:opacity 0.3s;}
    .hero-noise{position:absolute;inset:0;z-index:2;opacity:0.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-repeat:repeat;}
    .main-content{background:var(--white)}

    .hero-inner{position:relative;z-index:3;max-width:var(--container);margin:0 auto;width:100%;min-height:100vh;padding:72px var(--space-7) var(--space-8);display:flex;flex-direction:column;justify-content:center}
    .hero-eyebrow{margin-bottom:var(--space-5);color:rgba(255,255,255,0.55);font-size:13px;letter-spacing:0.15em}
    .hero-title{font-size:clamp(40px,5.5vw,76px);line-height:0.98;margin-bottom:var(--space-5);letter-spacing:-0.04em;color:var(--white);max-width:680px;text-wrap:balance;font-weight:800;}
    [dir="rtl"] .hero-title{line-height:1.25;}

    /* RTL overrides */
    [dir="rtl"] .bundle-grid{direction:rtl}
    [dir="rtl"] .bundle-content{text-align:right}
    [dir="rtl"] .bundle-meta-value .original{margin-left:0;margin-right:var(--space-2)}
    [dir="rtl"] .offer-card{direction:rtl}
    [dir="rtl"] .offer-content{text-align:right}
    [dir="rtl"] .offer-visual{direction:ltr}
    [dir="rtl"] .offer-eyebrow::before{display:none}
    [dir="rtl"] .offer-eyebrow::after{content:'';width:24px;height:2px;background:var(--accent-light)}
    [dir="rtl"] .offer-check svg{transform:scaleX(-1)}
    [dir="rtl"] .offer-cta:hover svg{transform:translateX(-4px)}
    [dir="rtl"] .trust-avatars img{margin-left:0;margin-right:-10px}
    [dir="rtl"] .trust-avatars img:first-child{margin-right:0}
    [dir="rtl"] .offer-save-badge{left:auto;right:var(--space-5)}
    [dir="rtl"] .offer-urgency{left:auto;right:var(--space-5)}
    [dir="rtl"] .hero-eyebrow{text-align:right}

    /* Arabic font on everything */
    [dir="rtl"] body,[dir="rtl"] button,[dir="rtl"] a,[dir="rtl"] input,[dir="rtl"] select,[dir="rtl"] textarea,[dir="rtl"] span,[dir="rtl"] p,[dir="rtl"] div,[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4,[dir="rtl"] label,[dir="rtl"] option{font-family:var(--ff) !important}

    .hero-title span{background:linear-gradient(135deg,#fff 0%,#a78bfa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .hero-desc{font-size:18px;color:rgba(255,255,255,0.6);max-width:460px;margin-bottom:var(--space-6);line-height:1.7;font-weight:400;}
    .hero-actions{display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:center}
    .hero-trust{display:flex;align-items:center;gap:var(--space-4);margin-top:var(--space-7);padding-top:var(--space-6);border-top:1px solid rgba(255,255,255,0.08)}
    .trust-avatars{display:flex}
    .trust-avatars img{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);margin-left:-10px;object-fit:cover}
    .trust-avatars img:first-child{margin-left:0}
    .trust-text{font-size:13px;color:rgba(255,255,255,0.5);font-weight:500}.trust-text strong{color:rgba(255,255,255,0.85);font-weight:700}
    
    /* Bundle */
    .bundle-section{padding:var(--space-10) 0 140px;background:var(--ink-soft);position:relative;z-index:1}
    .bundle-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:0;border-radius:var(--radius-xl);overflow:hidden;background:var(--ink-soft);min-height:420px;position:relative;}
    .bundle-content{padding:var(--space-8);display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
    .bundle-title{font-size:clamp(28px,3vw,42px);font-weight:900;margin-bottom:var(--space-3);line-height:1.08;color:var(--white);letter-spacing:-0.03em}
    .bundle-desc{font-size:15px;color:rgba(255,255,255,0.55);line-height:1.7;margin-bottom:var(--space-6);max-width:420px}
    .bundle-meta{display:flex;gap:var(--space-6);margin-bottom:var(--space-6)}
    .bundle-meta-item{display:flex;flex-direction:column;gap:2px}
    .bundle-meta-label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.4);font-weight:700}
    .bundle-meta-value{font-size:24px;font-weight:800;color:var(--white);letter-spacing:-0.02em}
    .bundle-meta-value .original{font-size:14px;color:rgba(255,255,255,0.3);text-decoration:line-through;margin-left:var(--space-2);font-weight:600}
    .bundle-visual{position:relative;padding:var(--space-6);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(91,33,182,0.08) 0%,transparent 70%);}
    .bundle-visual img{max-width:100%;max-height:320px;object-fit:contain;border-radius:var(--radius-md);filter:drop-shadow(0 20px 40px rgba(0,0,0,0.4));transition:transform var(--duration-slow) var(--ease-out-expo)}
    .bundle-grid:hover .bundle-visual img{transform:scale(1.04) translateY(-8px)}
    .bundle-badge{position:absolute;top:var(--space-5);right:var(--space-5);background:linear-gradient(135deg,var(--accent),var(--accent-light));color:var(--white);font-size:11px;font-weight:800;padding:8px 16px;border-radius:var(--radius-pill);box-shadow:0 4px 20px rgba(91,33,182,0.3);letter-spacing:0.05em;}
    .bundle-glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(91,33,182,0.2) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1;}

     /* Products */
     .product-section{padding:var(--space-10) 0 140px;background:var(--white);position:relative;z-index:1}
     .product-section::before{content:'';position:absolute;top:-1px;left:0;right:0;height:80px;background:white;clip-path:ellipse(60% 100% at 50% 0%);z-index:2;pointer-events:none}
    .product-inner{max-width:1600px;margin:0 auto;padding:0 var(--space-7)}
    .section-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-7);flex-wrap:wrap}
    .section-header{display:flex;align-items:center;gap:var(--space-5);flex-wrap:wrap}
    .section-title{font-size:clamp(24px,2.5vw,36px);font-weight:900;letter-spacing:-0.035em;line-height:1.1}
    .section-desc{font-size:15px;color:var(--text-secondary);line-height:1.6}
    .view-all-link{position:relative;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;padding:10px 28px;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--white);cursor:pointer;transition:all var(--duration-base) var(--ease-out-expo);color:var(--ink);display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap;text-decoration:none;overflow:hidden;user-select:none}
    .view-all-link::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--ink);transform:scaleX(0.85) scaleY(0.65);opacity:0;transition:all var(--duration-base) var(--ease-out-expo)}
    .view-all-link span{position:relative;z-index:1;display:inline-flex;align-items:center;gap:var(--space-2)}
    .view-all-link svg{transition:transform var(--duration-base) var(--ease-out-expo)}
    .view-all-link:hover{border-color:var(--ink);color:var(--white);transform:translateY(-3px);box-shadow:var(--shadow-glow)}
    .view-all-link:hover::before{transform:scaleX(1) scaleY(1);opacity:1}
    .view-all-link:hover svg{transform:translateX(4px)}
    .view-all-link:active{transform:translateY(-1px) scale(0.97)}
    
    .cat-filters{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
    .cat-filter{position:relative;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;padding:8px 20px;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--white);cursor:pointer;transition:all var(--duration-fast) var(--ease-out-quart);color:var(--text-secondary);letter-spacing:0.01em;overflow:hidden;user-select:none}
    .cat-filter::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--ink);transform:scaleX(0.85) scaleY(0.65);opacity:0;transition:all var(--duration-base) var(--ease-out-expo)}
    .cat-filter:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
    .cat-filter:active{transform:translateY(0) scale(0.96)}
    .cat-filter.active{border-color:var(--ink);color:var(--white)}.cat-filter.active::before{transform:scaleX(1) scaleY(1);opacity:1}
    .cat-filter span{position:relative;z-index:1}
    
    /* Product Cards */
    .products-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-5);}
    @media(max-width:1200px){.products-grid{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:900px){.products-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:600px){.products-grid{grid-template-columns:repeat(2,1fr);gap:var(--space-2)}}
    
    .product-card{
      background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);
      display:flex;flex-direction:column;position:relative;cursor:pointer;
      transition:all var(--duration-base) var(--ease-out-expo);will-change:transform;
      overflow:hidden;
    }
    .product-card:hover{transform:translateY(-8px);box-shadow:0 20px 60px rgba(11,11,16,0.12),0 8px 24px rgba(91,33,182,0.06)}
    
    .product-card .product-img-wrap{position:relative;aspect-ratio:320/400;overflow:hidden;background:var(--paper-warm);display:flex;align-items:center;justify-content:center;padding:var(--space-5)}
    .product-card .product-img-wrap img{width:100%;height:100%;object-fit:contain;transition:transform var(--duration-slow) var(--ease-out-expo)}
    .product-card:hover .product-img-wrap img{transform:scale(1.04)}
    
    .product-card .product-body{padding:var(--space-3) var(--space-3) var(--space-4);display:flex;flex-direction:column;gap:var(--space-1);flex:1}
    .product-card .product-brand{font-size:10px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.08em;opacity:0.55;transition:opacity var(--duration-fast)}
    .product-card:hover .product-brand{opacity:0.7}
    .product-card .product-name{font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .product-card .product-rating{display:flex;align-items:center;gap:var(--space-1);font-size:12px;color:#f59e0b;margin-top:auto}
    .product-card .product-rating .count{color:var(--text-tertiary);font-size:11px;margin-left:var(--space-1)}
    .product-card .product-footer{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3);padding-top:0;gap:var(--space-2)}
    .product-card .price{font-size:16px;font-weight:800;letter-spacing:-0.02em;transition:color var(--duration-fast);display:flex;align-items:baseline;gap:var(--space-2)}
    .product-card .price .old-price{font-size:14px;color:#dc2626;text-decoration:line-through;font-weight:800;opacity:0.7}
    .product-card .price .sale-price{color:#16a34a}
    .product-card.on-sale{border-color:rgba(220,38,38,0.15);box-shadow:0 0 0 1px rgba(220,38,38,0.06)}

    /* Empty State */

    /* Skeleton */

    @media(max-width:900px){.skeleton-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:600px){.skeleton-grid{grid-template-columns:repeat(2,1fr);gap:var(--space-2)}}
    .skeleton-card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)}
    .skeleton-img{width:100%;aspect-ratio:1/1;background:linear-gradient(90deg,var(--paper-warm) 25%,var(--paper-cool) 50%,var(--paper-warm) 75%);background-size:200% 100%;border-radius:var(--radius-md);animation:skeleton 1.5s infinite}
    .skeleton-line{height:14px;background:linear-gradient(90deg,var(--paper-warm) 25%,var(--paper-cool) 50%,var(--paper-warm) 75%);background-size:200% 100%;border-radius:var(--radius-sm);animation:skeleton 1.5s infinite}
    .skeleton-line.short{width:60%}
    .skeleton-btn{height:42px;border-radius:var(--radius-pill);background:linear-gradient(90deg,var(--paper-warm) 25%,var(--paper-cool) 50%,var(--paper-warm) 75%);background-size:200% 100%;animation:skeleton 1.5s infinite;margin-top:auto;width:100px;align-self:flex-end}
    @keyframes skeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

     .offer-card::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;border-radius:inherit;opacity:0.5}

     .offer-visual .visual-main{position:relative;z-index:2;max-width:220px;max-height:220px;object-fit:contain;filter:drop-shadow(0 20px 50px rgba(0,0,0,0.5));transition:transform 0.7s cubic-bezier(0.16,1,0.3,1)}

     .offer-save-badge{position:absolute;top:var(--space-5);left:var(--space-5);z-index:5;background:linear-gradient(135deg,#dc2626,#b91c1c);color:var(--white);font-size:13px;font-weight:900;padding:8px 16px;border-radius:var(--radius-pill);box-shadow:0 8px 32px rgba(220,38,38,0.4);letter-spacing:0.04em;animation:badgePulse 2.5s ease-in-out infinite}

     .offer-urgency{position:absolute;bottom:var(--space-5);left:var(--space-5);z-index:5;background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.9);font-size:11px;font-weight:700;padding:8px 14px;border-radius:var(--radius-pill);display:flex;align-items:center;gap:6px;letter-spacing:0.03em}

     .offer-title{font-size:clamp(26px,2.8vw,36px);font-weight:900;color:var(--white);line-height:1.1;letter-spacing:-0.03em}
     .offer-desc{font-size:14px;color:rgba(255,255,255,0.55);line-height:1.6;margin-top:-8px}

     .offer-pricing{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap;margin:var(--space-3) 0;padding:var(--space-4) 0;border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06)}
     .offer-original{font-size:16px;color:rgba(255,255,255,0.3);text-decoration:line-through;font-weight:600}
     .offer-sale{font-size:clamp(30px,3.2vw,40px);font-weight:900;color:var(--white);letter-spacing:-0.02em;transition:text-shadow 0.4s ease}
     .offer-card:hover .offer-sale{text-shadow:0 0 30px rgba(167,139,250,0.3)}
     .offer-savings{font-size:12px;font-weight:800;color:#4ade80;background:rgba(74,222,128,0.12);padding:5px 12px;border-radius:var(--radius-pill);letter-spacing:0.02em}
     .offer-cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:var(--radius-pill);background:linear-gradient(135deg,var(--accent),var(--accent-light));color:var(--white);font-size:14px;font-weight:800;text-decoration:none;border:none;cursor:pointer;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;letter-spacing:0.02em;margin-top:auto}
     .offer-cta::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent-light),#a78bfa);opacity:0;transition:opacity 0.4s ease}

      @media(max-width:768px){

     .offers-empty{text-align:center;padding:var(--space-8) var(--space-5);display:flex;flex-direction:column;align-items:center;gap:var(--space-2)}

    /* About */
    .about-section {
      position: relative;
      background: var(--ink-soft);
      z-index: 1;
      color: var(--white)
    }
    .about-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10% 50%, rgba(91,33,182,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 90% 30%, rgba(255,107,53,0.08) 0%, transparent 50%);
      pointer-events: none
    }
    .about-section::after {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none
    }
    .about-inner {
      position: relative;
      z-index: 3;
      max-width: var(--container);
      margin: 0 auto;
      width: 100%;
      padding: var(--space-10) var(--space-7);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-9)
    }
    .about-text {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
      justify-content: center
    }
    .about-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent-light)
    }
    .about-eyebrow::before {
      content: '';
      width: 28px;
      height: 2px;
      background: var(--accent-light)
    }
    .about-name {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--white)
    }
    .about-name .accent {
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text
    }
    .about-tagline {
      font-size: 16px;
      color: rgba(255,255,255,0.5);
      line-height: 1.8;
      max-width: 460px
    }
    .about-details {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-top: var(--space-2)
    }
    .about-detail {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      font-weight: 600;
      padding: 5px 12px 5px 8px;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      transition: all var(--fast);
      white-space: nowrap
    }
    .about-detail:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8)
    }
    .about-detail svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      color: var(--accent-light)
    }
    .about-socials {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-2)
    }
    .about-social {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 600;
      transition: all var(--fast)
    }
    .about-social svg {
      width: 16px;
      height: 16px
    }
    .about-social:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.2);
      color: var(--white);
      transform: translateY(-2px)
    }
    .about-location {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 600;
      margin-top: var(--space-3);
      transition: all var(--fast)
    }
    .about-location svg {
      width: 14px;
      height: 14px
    }
    .about-location:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.2);
      color: var(--white);
      transform: translateY(-1px)
    }
    .about-visual {
      position: relative;
      border-radius: 24px
    }
    .about-img {
      width: 100%;
      height: 100%;
      min-height: 360px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      transition: transform .5s cubic-bezier(.16,1,.3,1), box-shadow .5s cubic-bezier(.16,1,.3,1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3)
    }
    .about-img:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 48px rgba(91,33,182,0.25), 0 8px 24px rgba(0,0,0,0.3)
    }
    .about-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .6s cubic-bezier(.16,1,.3,1)
    }
    .about-img:hover img {
      transform: scale(1.05)
    }
    .about-glow { display: none }

    /* Footer */
    .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(250,249,247,0.95);backdrop-filter:blur(20px) saturate(1.3);border-top:1px solid var(--border);padding:10px 0 env(safe-area-inset-bottom);z-index:90;box-shadow:0 -4px 20px rgba(11,11,16,0.05);}
    .bottom-nav-inner{display:flex;justify-content:space-around}

    .bottom-nav-item.active,.bottom-nav-item:hover{color:var(--ink)}
    .bottom-nav-item svg{width:22px;height:22px;stroke-width:2}
    .bottom-nav-badge{position:absolute;top:0;right:4px;width:16px;height:16px;background:var(--accent);color:var(--white);font-size:9px;font-weight:800;border-radius:50%;display:flex;align-items:center;justify-content:center}

    /* Toasts */
    .toast-container{position:fixed;top:calc(var(--nav-h) + var(--space-6));right:var(--space-5);z-index:200;display:flex;flex-direction:column;gap:var(--space-3);pointer-events:none}
    .toast{background:var(--ink);color:var(--white);padding:14px 22px;border-radius:var(--radius-md);font-size:13px;font-weight:600;display:flex;align-items:center;gap:var(--space-3);box-shadow:var(--shadow-xl);transform:translateX(120%);transition:transform var(--duration-base) var(--ease-out-expo);pointer-events:auto;min-width:260px;max-width:90vw;}
    .toast.show{transform:translateX(0)}
    .toast-icon{width:20px;height:20px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}.toast-icon svg{width:12px;height:12px;color:var(--white)}

    /* Site Footer */
    .site-footer{background:var(--ink-soft);padding:var(--space-10) 0 var(--space-7);position:relative;z-index:1}
    .site-footer::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(91,33,182,0.08) 0%,transparent 60%);pointer-events:none}
    .footer-inner{max-width:var(--container);margin:0 auto;padding:0 var(--space-7);position:relative;z-index:2}
    .footer-brand{display:flex;flex-direction:column;line-height:1;margin-bottom:var(--space-4)}
    .footer-brand .logo-main{font-size:22px;font-weight:900;letter-spacing:-0.04em;color:var(--white)}
    .footer-brand .logo-sub{font-size:9px;font-weight:700;letter-spacing:0.32em;color:rgba(255,255,255,0.4);margin-top:3px}
    .footer-tagline{font-size:14px;color:rgba(255,255,255,0.45);max-width:400px;line-height:1.7;margin-bottom:var(--space-7)}
    .footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-7);margin-bottom:var(--space-8)}
    .footer-col{display:flex;flex-direction:column;gap:var(--space-3)}
    .footer-col h4{font-size:11px;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:var(--space-1)}
    .footer-col a{font-size:14px;color:rgba(255,255,255,0.55);transition:color var(--duration-fast);font-weight:500}
    .footer-col a:hover{color:var(--white)}
    .footer-bottom{border-top:1px solid rgba(255,255,255,0.06);padding-top:var(--space-6);text-align:center}
    .footer-bottom span{font-size:12px;color:rgba(255,255,255,0.3);font-weight:500}
    @media(max-width:640px){.footer-grid{grid-template-columns:1fr;gap:var(--space-6)}.footer-inner{padding:0 var(--space-5)}}

    /* Quick View Modal */
    .qv-overlay{position:fixed;inset:0;background:rgba(11,11,16,0.6);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s ease;padding:var(--space-5)}
    .qv-overlay.open{opacity:1;pointer-events:auto}
    .qv-modal{background:var(--white);border-radius:var(--radius-xl);max-width:800px;width:100%;max-height:90vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 32px 80px rgba(0,0,0,0.2);transform:translateY(20px) scale(0.96);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);position:relative}
    .qv-overlay.open .qv-modal{transform:translateY(0) scale(1)}
    .qv-close{position:absolute;top:var(--space-4);right:var(--space-4);width:36px;height:36px;border-radius:50%;border:none;background:var(--paper-warm);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;transition:background var(--duration-fast);color:var(--text)}
    .qv-close:hover{background:var(--paper-cool)}
    .qv-img{background:var(--paper-warm);border-radius:var(--radius-xl) 0 0 var(--radius-xl);display:flex;align-items:center;justify-content:center;padding:var(--space-6);overflow:hidden}
    .qv-img img{max-width:100%;max-height:360px;object-fit:contain}
    .qv-body{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
    .qv-brand{font-size:11px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em}
    .qv-name{font-size:22px;font-weight:800;letter-spacing:-0.03em;line-height:1.2}
    .qv-price{font-size:26px;font-weight:900;letter-spacing:-0.02em}
    .qv-desc{font-size:14px;color:var(--text-secondary);line-height:1.7}
    .qv-add-btn{flex:1;height:50px;border-radius:var(--radius-pill);border:none;background:var(--ink);color:var(--white);font-size:14px;font-weight:700;cursor:pointer;transition:all var(--duration-fast);display:flex;align-items:center;justify-content:center;gap:8px}
    .qv-add-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .qv-add-btn.added{background:var(--success)}
    @media(max-width:700px){.qv-modal{grid-template-columns:1fr}.qv-img{border-radius:var(--radius-xl) var(--radius-xl) 0 0;min-height:200px}}

    /* Responsiveness */
    @media(max-width:1024px){
      .hero-card{min-height:600px}.hero-inner{padding:72px var(--space-5) var(--space-7)}
      .bundle-grid{grid-template-columns:1fr}.bundle-visual{min-height:280px}
      .about-inner{grid-template-columns:1fr;gap:var(--space-8);text-align:center;padding:var(--space-9) var(--space-5)}.about-eyebrow{justify-content:center}.about-details{justify-content:center}.about-tagline{margin:0 auto}.about-visual{order:-1}.about-img{min-height:260px}
    }
    @media(max-width:900px){
      .navbar-burger{display:block}
      .navbar-links{display:none;position:absolute;top:calc(var(--nav-h) - 8px);left:0;right:0;background:var(--white);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);flex-direction:column;padding:var(--space-4);gap:var(--space-3);border:1px solid var(--border)}
      .navbar-links.is-open{display:flex;animation:slideDown .25s var(--ease-out-quart)}
      .product-inner{padding:0 var(--space-5)}
      .hero-inner{padding:var(--space-7) var(--space-5)}.hero-title{font-size:36px}
    }
    @media(max-width:640px){
      .hero-card{min-height:450px}.hero-inner{padding:56px var(--space-4) calc(var(--space-7) + 40px);min-height:450px}.hero-title{font-size:32px}.hero-desc{font-size:16px}
      .hero-actions{flex-direction:column;align-items:stretch}.hero-actions .btn-premium,.hero-actions .btn-ghost,.hero-actions .btn-white{width:100%;justify-content:center}
      .product-card .product-body{padding:var(--space-2) var(--space-2) var(--space-3)}
      .product-card .product-brand{font-size:9px}
      .product-card .product-name{font-size:12px}
      .product-card .product-footer{padding:var(--space-2)}
      .product-card .add-to-cart-btn{width:40px;height:40px;padding:0;line-height:0}
      .product-card .add-to-cart-btn svg{width:16px;height:16px}
      .cat-filter{font-size:11px;padding:6px 14px}
      .view-all-link{padding:8px 20px;font-size:12px}
      .bundle-content{padding:var(--space-5)}.bundle-meta{gap:var(--space-4)}.bundle-meta-value{font-size:20px}
      .about-inner{gap:var(--space-5)}
      .about-section{padding-bottom:80px}
      .offers-scroll{gap:var(--space-3)}
    }
    @keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
    .whatsapp-fab{position:fixed;bottom:24px;right:20px;z-index:999;width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,211,102,0.4);cursor:pointer;transition:transform .2s,box-shadow .2s;text-decoration:none}.whatsapp-fab:hover{transform:scale(1.1);box-shadow:0 6px 24px rgba(37,211,102,0.5)}.whatsapp-fab svg{width:30px;height:30px;fill:#fff}.whatsapp-tooltip{position:fixed;bottom:90px;right:20px;z-index:999;background:#fff;color:#333;padding:10px 16px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.15);font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;pointer-events:none}.whatsapp-tooltip.show{opacity:1;transform:translateY(0)}.whatsapp-tooltip::after{content:'';position:absolute;bottom:-6px;right:20px;width:12px;height:12px;background:#fff;box-shadow:4px 4px 6px rgba(0,0,0,0.08);transform:rotate(45deg)}.whatsapp-fab.pulse{animation:waPulse 1s ease-in-out 3}.whatsapp-fab:hover~.whatsapp-tooltip,.whatsapp-tooltip.show{opacity:1;transform:translateY(0)}@keyframes waPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  </style>
</head>
<body>
  <div class="toast-container" id="toast-container"></div>

  <header class="navbar" id="navbar" x-data="{ mobileOpen: false }">
    <div class="navbar-inner">
      <button class="navbar-burger" @click="mobileOpen = !mobileOpen" :aria-label="$store.lang.t('nav.menu')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="/" class="navbar-logo"><span class="logo-main">IRONFUEL</span><span class="logo-sub">NUTRITION</span></a>
      <nav class="navbar-links" :class="{ 'is-open': mobileOpen }">
        <a href="/" class="navbar-link" x-text="$store.lang.t('nav.home')"></a>
        <a href="/shop.html" class="navbar-link" x-text="$store.lang.t('nav.shop')"></a>
        <a href="/deals.html" class="navbar-link" x-text="$store.lang.t('nav.offers')"></a>
        <a href="/about.html" class="navbar-link" x-text="$store.lang.t('nav.about')"></a>
      </nav>
      <div class="navbar-actions">
        <a href="/cart" class="navbar-icon-btn" :aria-label="$store.lang.t('nav.cart')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" x-text="$store.cart.count" x-show="$store.cart.count > 0" x-cloak>0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="hero-wrap">
      <div class="hero-card">
        <img src="/assets/images/hersection-image-16-9.png" alt="" class="hero-bg"/>
        <div class="hero-bg-overlay"></div>
        <div class="hero-noise"></div>
        <div class="hero-inner" x-data>
          <p class="eyebrow light hero-eyebrow" x-text="$store.lang.t('hero.eyebrow')"></p>
          <h1 class="hero-title"><span x-text="$store.lang.t('hero.title1')"></span><br/><span x-text="$store.lang.t('hero.title2')"></span></h1>
          <p class="hero-desc" x-text="$store.lang.t('hero.desc')"></p>
          <div class="hero-actions">
            <a href="/shop.html" class="btn-white" x-text="$store.lang.t('hero.cta')"></a>
          </div>

        </div>
      </div>
    </div>

    <div id="offers" class="offers-section" x-data="offerData()" x-show="!loading && list.length > 0" x-cloak>
      <div class="container">
        <div class="section-top reveal">
          <div class="section-header">
            <p class="eyebrow" x-text="$store.lang.t('offers.eyebrow')"></p>
            <h2 class="section-title" x-text="$store.lang.t('offers.title')"></h2>
            <p class="section-desc" x-text="$store.lang.t('offers.desc')"></p>
          </div>
          <a href="/offers" class="view-all-link">
            <span><span x-text="$store.lang.t('offers.viewAll')"></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></span>
          </a>
        </div>
        <div x-show="loading" class="skeleton-grid reveal" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-4)">
          <template x-for="i in 3" :key="i">
            <div class="skeleton-card">
              <div class="skeleton-img" style="aspect-ratio:16/9"></div>
              <div class="skeleton-line short"></div>
              <div class="skeleton-line"></div>
            </div>
          </template>
        </div>
        <div x-show="!loading && list.length===0" class="offers-empty">
          <div class="offers-empty-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </div>
          <h3 x-text="$store.lang.t('offers.empty')"></h3>
          <p x-text="$store.lang.t('offers.emptyDesc')"></p>
          <a href="/shop.html" class="btn-premium" style="margin-top:var(--space-3)" x-text="$store.lang.t('offers.browse')"></a>
        </div>
        <div class="offers-scroll" x-show="!loading && list.length>0">
          <template x-for="(pk, index) in list" :key="pk.id">
            <a :href="'/pack.html?id='+pk.id" class="offer-card reveal" :class="'reveal-delay-' + ((index % 3 + 1))">
              <div class="offer-visual">
                <div class="visual-glow"></div>
                <template x-if="pk.mappedProducts && pk.mappedProducts.length > 0">
                  <div class="product-thumbs">
                    <template x-for="(prod, i) in pk.mappedProducts.slice(0, 3)" :key="prod.id">
                      <img :src="prod.image || 'https://placehold.co/80x80/1a1a2e/ffffff?text='+encodeURIComponent(prod.name)" :alt="prod.name" class="product-thumb" loading="lazy"/>
                      <span x-show="i < Math.min(pk.mappedProducts.length, 3) - 1" class="thumb-plus">+</span>
                    </template>
                  </div>
                </template>
                <template x-if="!pk.mappedProducts || pk.mappedProducts.length === 0">
                  <img :src="pk.image || 'https://placehold.co/400x400/1a1a2e/ffffff?text='+encodeURIComponent(pk.name||'Bundle')" :alt="pk.name||''" class="visual-main" loading="lazy"/>
                </template>
                <span class="offer-save-badge" x-show="(pk.original_price||0)>0" x-text="$store.lang.t('offers.save')+' '+Math.round((1-pk.price/pk.original_price)*100)+'%'"></span>
                <span class="offer-urgency" x-show="pk.days_valid">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  <span x-text="$store.lang.t('offers.endsIn')+' '+getCountdown(pk)"></span>
                </span>
              </div>
              <div class="offer-content">
                <p class="offer-eyebrow" x-text="$store.lang.t('offers.limited')"></p>
                <p class="offer-title" x-text="pk.name||$store.lang.t('offers.bundle')"></p>
                <p class="offer-desc" x-text="pk.description" x-show="pk.description"></p>
                <div class="offer-includes">
                  <p class="offer-includes-title" x-text="$store.lang.t('offers.includesTitle')"></p>
                  <template x-for="prod in pk.mappedProducts.slice(0, 4)" :key="prod.id">
                    <span>
                      <span class="offer-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>
                      <span x-text="prod.name"></span>
                    </span>
                  </template>
                  <span x-show="(pk.mappedProducts?.length||0) > 4">
                    <span class="offer-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>
                    <span x-text="'+'+((pk.mappedProducts?.length||0)-4)+' '+$store.lang.t('offers.moreItems')"></span>
                  </span>
                </div>
                <div class="offer-pricing">
                  <span class="offer-original" x-show="(pk.original_price||0)>0" x-text="Number(pk.original_price).toLocaleString()+' '+$store.lang.t('currency')"></span>
                  <span class="offer-sale" x-text="Number(pk.price||0).toLocaleString()+' '+$store.lang.t('currency')"></span>
                  <span class="offer-savings" x-show="(pk.original_price||0)>0" x-text="$store.lang.t('offers.saveAmount')+' '+Number(pk.original_price-pk.price).toLocaleString()+' '+$store.lang.t('currency')"></span>
                </div>
                <button class="offer-cta">
                  <span><span x-text="$store.lang.t('offers.getTheDeal')"></span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></span>
                </button>
              </div>
            </a>
          </template>
        </div>
      </div>
    </div>

    <div id="products" class="product-section" x-data="productData()">
      <div class="product-inner">
        <div class="section-top reveal">
          <div class="section-header">
            <h2 class="section-title" x-text="$store.lang.t('products.title')"></h2>
            <div class="cat-filters">
              <button class="cat-filter" :class="{ active: activeCat === '' }" @click="filter('')"><span x-text="$store.lang.t('products.all')"></span></button>
              <button class="cat-filter" :class="{ active: activeCat === 'whey-protein' }" @click="filter('whey-protein')"><span>Whey Protein</span></button>
              <button class="cat-filter" :class="{ active: activeCat === 'creatine' }" @click="filter('creatine')"><span>Creatine</span></button>
              <button class="cat-filter" :class="{ active: activeCat === 'pre-workout' }" @click="filter('pre-workout')"><span>Pre-Workout</span></button>
            </div>
          </div>
          <a href="/shop.html" class="view-all-link">
            <span><span x-text="$store.lang.t('products.viewAll')"></span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></span>
          </a>
        </div>
        
        <div x-show="loading" class="skeleton-grid reveal">
          <template x-for="i in 4" :key="i">
            <div class="skeleton-card">
              <div class="skeleton-img"></div>
              <div class="skeleton-line short"></div>
              <div class="skeleton-line"></div>
              <div class="skeleton-btn"></div>
            </div>
          </template>
        </div>

        <div x-show="!loading && items.length===0" class="empty-state-container reveal">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <h3 x-text="$store.lang.t('products.noProducts')"></h3>
          <p x-text="$store.lang.t('products.noProductsDesc')"></p>
        </div>

        <div class="products-grid" x-show="!loading && items.length>0">
          <template x-for="(p,i) in items" :key="p.id">
            <div class="product-card" :class="{ 'reveal reveal-delay-'+(i%5+1), 'on-sale': (p.compareAtPrice||0)>0 }" x-data="{ added: false }">
              <span class="sale-badge" x-show="(p.compareAtPrice||0)>0" x-text="$store.lang.t('products.sale')"></span>
              <span class="product-badge" x-show="(function(){ if(!p.createdAt) return false; var d=new Date(p.createdAt); var now=new Date(); return (now - d) < 7*24*60*60*1000; })() && !(p.compareAtPrice>0)" x-text="$store.lang.t('products.new')"></span>
              <button class="product-wishlist" :style="$store.wishlist.has(p.id) ? 'color:#dc2626;opacity:1' : ''" @click.stop="$store.wishlist.toggle(p.id);showToast($store.wishlist.has(p.id)?'Added to wishlist':'Removed from wishlist')" aria-label="Add to wishlist">
                <svg width="14" height="14" viewBox="0 0 24 24" :fill="$store.wishlist.has(p.id)?'currentColor':'none'" stroke="currentColor" stroke-width="2.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </button>
              <div class="product-img-wrap" @click="window.location.href='/product.html?slug='+p.slug">
                <img :src="p.image||'https://placehold.co/400x400/f3f1ee/0b0b10?text='+encodeURIComponent(p.name||'')" :alt="p.name" loading="lazy" @error="$el.src='https://placehold.co/400x400/f3f1ee/0b0b10?text='+encodeURIComponent(p.name||'')"/>
                </div>
              <div class="product-body">
                <p class="product-brand" x-text="p.brand||'IronFuel'"></p>
                <p class="product-name" x-text="p.name||''"></p>
                <div class="product-rating">
                  <span x-html="'&#9733;'.repeat(Math.round(p.rating||0))+'&#9734;'.repeat(5-Math.round(p.rating||0))"></span>
                  <span class="count" x-text="'('+(p.reviews||0)+')'"></span>
                </div>
              </div>
              <div class="product-footer">
                <p class="price">
                  <span class="sale-price" x-show="(p.compareAtPrice||0)>0" x-text="(p.price||0).toLocaleString()+' '+$store.lang.t('currency')"></span>
                  <span x-show="!(p.compareAtPrice>0)" x-text="(p.price||0).toLocaleString()+' '+$store.lang.t('currency')"></span>
                  <span class="old-price" x-show="(p.compareAtPrice||0)>0" x-text="Number(p.compareAtPrice).toLocaleString()"></span>
                </p>
                <button class="add-to-cart-btn" :class="{ added }" @click.stop="$store.cart.add(p);added=true;showToast(p.name+' '+$store.lang.t('toast.addedToCart'));setTimeout(()=>added=false,1500)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <div id="about" class="about-section" x-data="aboutData()">
      <div class="about-inner reveal">
        <div class="about-text">
          <p class="about-eyebrow" x-text="$store.lang.t('about.eyebrow')"></p>
          <p class="about-name" x-text="info.store_name||'IronFuel Nutrition'"></p>
          <p class="about-tagline" x-text="info.store_description || $store.lang.t('about.desc')"></p>
          <div class="about-details">
            <div class="about-detail" x-show="info.owner_name">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span x-text="info.owner_name"></span>
            </div>
            <div class="about-detail" x-show="info.phone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <span x-text="info.phone"></span>
            </div>
            <div class="about-detail" x-show="info.location">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span x-text="info.location"></span>
            </div>
          </div>
          <div class="about-socials">
            <a class="about-social" x-show="info.instagram" :href="info.instagram" target="_blank" rel="noopener">

  <script>
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = '<div class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><span>' + message + '</span>';
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 2800);
    }

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

    document.addEventListener('alpine:init', () => {
      Alpine.store('cart', {
        items: JSON.parse(localStorage.getItem('ironfuel_cart') || '[]'),
        add(item) {
          const existing = this.items.find(i => i.id === item.id);
          if (existing) { existing.qty += 1 } else { this.items.push({ ...item, qty: 1 }) }
          this.save();
        },
        remove(id) { this.items = this.items.filter(i => i.id !== id); this.save() },
        get count() { return this.items.reduce((s, i) => s + i.qty, 0) },
        get total() { return this.items.reduce((s, i) => s + i.price * i.qty, 0) },
        save() { localStorage.setItem('ironfuel_cart', JSON.stringify(this.items)) }
      });

      Alpine.store('wishlist', {
        items: JSON.parse(localStorage.getItem('ironfuel_wishlist') || '[]'),
        toggle(id) {
          const idx = this.items.indexOf(id);
          if (idx > -1) { this.items.splice(idx, 1) } else { this.items.push(id) }
          this.save();
        },
        has(id) { return this.items.includes(id) },
        save() { localStorage.setItem('ironfuel_wishlist', JSON.stringify(this.items)) }
      });

      Alpine.data('productData', () => ({
        items: [], allItems: [], activeCat: '', loading: true,
        init() { this.load(); this.observeReveals(); },
        async load() {
          this.loading = true;
          try {
            const r = await fetch('/api/products?limit=50');
            if (!r.ok) throw new Error('status ' + r.status);
            const data = await r.json();
            this.allItems = data.products || data;
            this.items = this.allItems;
          } catch (e) { console.error('products fetch:', e) }
          finally { this.loading = false; this.$nextTick(() => this.observeReveals()); }
        },
        filter(cat) {
          this.activeCat = cat;
          this.items = cat ? this.allItems.filter(p => p.categorySlug === cat) : this.allItems;
          this.$nextTick(() => this.observeReveals());
        },
        observeReveals() {
          document.querySelectorAll('.product-card.reveal, .offer-card.reveal').forEach(el => {
            el.classList.remove('visible');
            revealObserver.observe(el);
          });
        }
      }));

      Alpine.data('bundleData', () => ({
        bundle: null, loading: true,
        init() { this.load() },
        async load() {
          this.loading = true;
          try {
            const r = await fetch('/api/packs');
            if (!r.ok) throw new Error('status ' + r.status);
            const data = await r.json();
            if (data && data.length > 0) this.bundle = data[0];
          } catch (e) { console.error('bundle fetch:', e) }
          finally { this.loading = false }
        }
      }));

      Alpine.data('offerData', () => ({
        list: [], products: {}, loading: true, timer: null,
        init() { this.load() },
        async load() {
          this.loading = true;
          if (this.timer) clearInterval(this.timer);
          try {
            const [packsRes, productsRes] = await Promise.all([
              fetch('/api/packs'),
              fetch('/api/products?limit=50')
            ]);
            if (!packsRes.ok) throw new Error('packs status ' + packsRes.status);
            const packs = await packsRes.json();
            const productMap = {};
            if (productsRes.ok) {
              const data = await productsRes.json();
              const products = data.products || data || [];
              products.forEach(p => { productMap[p.id] = p });
            }
            this.list = packs.map(pack => ({
              ...pack,
              mappedProducts: (pack.product_ids || []).map(id => productMap[id]).filter(Boolean)
            }));
            this.$nextTick(() => this.observeReveals());
            this.startCountdown();
          } catch (e) { console.error('offers fetch:', e) }
          finally { this.loading = false }
        },
        observeReveals() {
          document.querySelectorAll('.offer-card.reveal').forEach(el => {
            el.classList.remove('visible');
            revealObserver.observe(el);
          });
        },
        getCountdown(pack) {
          if (!pack.expires_at) return pack.days_valid ? pack.days_valid + 'd' : '';
          const now = new Date();
          const exp = new Date(pack.expires_at);
          const diff = exp - now;
          if (diff <= 0) return 'Ended';
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          return days + 'd ' + String(hours).padStart(2, '0') + 'h ' + String(mins).padStart(2, '0') + 'm';
        },
        startCountdown() {
          if (this.timer) clearInterval(this.timer);
          this.timer = setInterval(() => {
            this.list = [...this.list];
          }, 60000);
        }
      }));

      Alpine.data('aboutData', () => ({
        info: {},
        async init() {
          try {
            const r = await fetch('/api/store-info');
            if (r.ok) this.info = await r.json();
          } catch (e) { console.error('about fetch:', e) }
        }
      }));
    });

    document.addEventListener('DOMContentLoaded', () => {
      const navbar = document.getElementById('navbar');
      if (navbar) {
        const check = () => navbar.classList.toggle('scrolled', window.scrollY > 20);
        window.addEventListener('scroll', check, { passive: true });
        check();
      }
      document.querySelectorAll('.reveal').forEach(el => { revealObserver.observe(el); });

      // Parallax hero background
      const heroBg = document.querySelector('.hero-bg');
      const heroOverlay = document.querySelector('.hero-bg-overlay');
      if (heroBg) {
        let ticking = false;
        window.addEventListener('scroll', () => {
          if (!ticking) {
            requestAnimationFrame(() => {
              const scrollY = window.scrollY;
              const heroH = window.innerHeight;
              if (scrollY < heroH) {
                const pct = scrollY / heroH;
                heroBg.style.transform = 'scale(' + (1.04 - pct * 0.04) + ') translateY(' + (scrollY * 0.3) + 'px)';
                if (heroOverlay) heroOverlay.style.opacity = 1 - pct * 0.3;
              }
              ticking = false;
            });
            ticking = true;
          }
        }, { passive: true });
      }

      // Staggered page load reveals
      const staggerElements = [
        { sel: '.navbar', delay: 0 },
        { sel: '.hero-eyebrow', delay: 100 },
        { sel: '.hero-title', delay: 200 },
        { sel: '.hero-desc', delay: 300 },
        { sel: '.hero-actions', delay: 400 },
        { sel: '.hero-trust', delay: 500 }
      ];
      staggerElements.forEach(({ sel, delay }) => {
        const el = document.querySelector(sel);
        if (el) {
          el.style.opacity = '0';
          el.style.transform = 'translateY(24px)';
          el.style.transition = 'opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1)';
          setTimeout(() => {
            el.style.opacity = '1';
            el.style.transform = 'translateY(0)';
          }, delay);
        }
      });
    });
  </script>

  <script>
    fetch('/api/store-info').then(r=>r.json()).then(d=>{
      if(d.whatsapp){
        var fab=document.getElementById('whatsapp-fab');fab.href=d.whatsapp;fab.style.display='flex';
