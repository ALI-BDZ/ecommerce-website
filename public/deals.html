<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deals — IronFuel Nutrition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link id="font-link" href="/css/fonts.css" rel="stylesheet"/>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>window.__i18n = window.__i18n || {};</script>
  <script src="/locales/en.js?v=2"></script>
  <script src="/locales/ar.js?v=2"></script>
  <script src="/locales/fr.js?v=2"></script>
  <script src="/js/i18n.js"></script>
  <style>
    :root{--ff:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--ink:#0b0b10;--ink-soft:#13131f;--paper:#f8f7f4;--paper-warm:#f0eeea;--paper-cool:#e8e6e3;--accent:#5b21b6;--accent-light:#7c3aed;--accent-glow:rgba(91,33,182,0.18);--white:#fff;--text:#0b0b10;--text-secondary:#6b6b78;--text-tertiary:#9a9aa8;--border:rgba(11,11,16,0.06);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-xl:32px;--radius-pill:999px;--shadow-sm:0 1px 2px rgba(11,11,16,0.04);--shadow-lg:0 16px 48px rgba(11,11,16,0.10);--shadow-xl:0 24px 80px rgba(11,11,16,0.14);--container:1520px;--nav-h:72px;--duration-fast:200ms;--duration-base:400ms;--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--ease-out-quart:cubic-bezier(0.25,1,0.5,1)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--ff);color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}

    /* Navbar — no dark hero behind it, so start scrolled */
    .navbar{position:fixed;top:var(--space-3);left:var(--space-3);right:var(--space-3);z-index:100;height:var(--nav-h);border-radius:var(--radius-xl);transition:background var(--duration-base) var(--ease-out-quart),box-shadow var(--duration-base),border-color var(--duration-base);background:rgba(250,249,247,0.85);backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
    .navbar-inner{max-width:var(--container);margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-5)}
    .navbar-burger{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:6px;border-radius:var(--radius-sm);transition:background var(--duration-fast)}
    .navbar-burger:hover{background:var(--paper-cool)}
    .navbar-logo{display:flex;flex-direction:column;line-height:1;color:var(--text);text-decoration:none;position:relative}
    .logo-sub{font-size:8px;font-weight:700;letter-spacing:0.32em;color:var(--text-tertiary);margin-top:2px}
    .navbar-links{display:flex;gap:var(--space-6);align-items:center}
    .navbar-link{font-size:13.5px;font-weight:600;letter-spacing:-0.01em;color:var(--text-secondary);transition:color var(--duration-fast);position:relative;padding:4px 0;}
    .navbar-link::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--accent);transition:width var(--duration-fast) var(--ease-out-expo);}
    .navbar-link:hover{color:var(--text)}.navbar-link:hover::after{width:100%}
    .navbar-link.active{color:var(--text)}.navbar-link.active::after{width:100%}
    .navbar-actions{display:flex;align-items:center;gap:var(--space-2)}
    .navbar-icon-btn{position:relative;background:none;border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;transition:background var(--duration-fast),transform var(--duration-fast);}
    .navbar-icon-btn:hover{background:var(--paper-cool);transform:translateY(-1px)}
    .cart-count{position:absolute;top:2px;right:2px;background:var(--accent);color:var(--white);font-size:9px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);}
.lang-switcher{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);border-radius:var(--radius-pill);padding:4px;box-shadow:0 2px 12px rgba(0,0,0,0.1);border:1px solid rgba(0,0,0,0.06);position:fixed;bottom:24px;left:24px;z-index:998;transition:transform .3s cubic-bezier(0.16,1,0.3,1),opacity .3s}
.lang-switcher:hover{transform:scale(1.05)}
.lang-switcher button{border:none;background:none;padding:3px;border-radius:50%;cursor:pointer;transition:transform .2s;line-height:0;display:flex;align-items:center;justify-content:center}
.lang-switcher button img{width:22px;height:22px;border-radius:50%;object-fit:cover;transition:transform .2s}
.lang-switcher button.active img{transform:scale(1.15);box-shadow:0 0 0 2px var(--accent)}
.lang-switcher button:hover img{transform:scale(1.08)}


    .page-hero{padding:calc(var(--nav-h) + var(--space-8)) 0 var(--space-7);text-align:center}
    .page-hero h1{font-size:clamp(32px,5vw,48px);font-weight:900;letter-spacing:-0.03em;margin-bottom:var(--space-3)}
    .page-hero p{font-size:16px;color:var(--text-secondary);max-width:500px;margin:0 auto}

    .deals-grid{max-width:var(--container);margin:0 auto;padding:0 var(--space-6) var(--space-8);display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--space-5)}
    .deal-card{background:var(--white);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column}
    .deal-card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,0.08)}
    .deal-img{aspect-ratio:16/10;overflow:hidden;background:var(--paper-warm)}
    .deal-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
    .deal-card:hover .deal-img img{transform:scale(1.05)}
    .deal-body{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);flex:1}
    .deal-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em}
    .deal-tag svg{width:14px;height:14px}
    .deal-name{font-size:20px;font-weight:800;letter-spacing:-0.02em}
    .deal-desc{font-size:14px;color:var(--text-secondary);line-height:1.6;flex:1}
    .deal-prices{display:flex;align-items:baseline;gap:var(--space-3)}
    .deal-price{font-size:22px;font-weight:900;color:var(--accent)}
    .deal-original{font-size:15px;color:var(--text-tertiary);text-decoration:line-through}
    .deal-save{font-size:12px;font-weight:700;color:var(--accent);background:rgba(91,33,182,0.08);padding:4px 10px;border-radius:var(--radius-pill)}
    .deal-btn{display:inline-flex;align-items:center;justify-content:center;height:44px;border-radius:var(--radius-pill);background:var(--ink);color:var(--white);font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .2s;margin-top:auto}
    .deal-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,11,16,0.15)}

    .empty{text-align:center;padding:var(--space-8) var(--space-6);color:var(--text-secondary)}
    .empty svg{width:48px;height:48px;margin:0 auto var(--space-4);color:var(--text-tertiary)}
    .empty h3{font-size:18px;font-weight:700;color:var(--text);margin-bottom:var(--space-2)}
    .empty p{font-size:14px}
    .skeleton-grid{max-width:var(--container);margin:0 auto;padding:0 var(--space-6);display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--space-5)}
    .skel{border-radius:var(--radius-lg);overflow:hidden;background:var(--white);border:1px solid var(--border)}
    .skel-img{aspect-ratio:16/10;background:linear-gradient(90deg,var(--paper-warm) 25%,#e8e6e3 50%,var(--paper-warm) 75%);background-size:200% 100%;animation:sk 1.5s infinite}
    .skel-body{padding:var(--space-5);display:flex;flex-direction:column;gap:12px}
    .skel-line{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--paper-warm) 25%,#e8e6e3 50%,var(--paper-warm) 75%);background-size:200% 100%;animation:sk 1.5s infinite}
    .skel-line.w60{width:60%}.skel-line.w40{width:40%}.skel-line.w80{width:80%}
    @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

    [x-cloak]{display:none!important}

    @media(max-width:900px){
      .navbar-burger{display:block}
      .navbar-links{display:none;position:absolute;top:calc(var(--nav-h) - 8px);left:0;right:0;background:var(--white);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);flex-direction:column;padding:var(--space-4);gap:var(--space-3);border:1px solid var(--border)}
      .navbar-links.is-open{display:flex;animation:slideDown .25s var(--ease-out-quart)}

    }
    @media(max-width:640px){
      .deals-grid,.skeleton-grid{grid-template-columns:1fr}
    }
    @keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
    .whatsapp-fab{position:fixed;bottom:24px;right:20px;z-index:999;width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,211,102,0.4);cursor:pointer;transition:transform .2s,box-shadow .2s;text-decoration:none}.whatsapp-fab:hover{transform:scale(1.1);box-shadow:0 6px 24px rgba(37,211,102,0.5)}.whatsapp-fab svg{width:30px;height:30px;fill:#fff}.whatsapp-tooltip{position:fixed;bottom:90px;right:20px;z-index:999;background:#fff;color:#333;padding:10px 16px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.15);font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;pointer-events:none}.whatsapp-tooltip.show{opacity:1;transform:translateY(0)}.whatsapp-tooltip::after{content:'';position:absolute;bottom:-6px;right:20px;width:12px;height:12px;background:#fff;box-shadow:4px 4px 6px rgba(0,0,0,0.08);transform:rotate(45deg)}.whatsapp-fab.pulse{animation:waPulse 1s ease-in-out 3}.whatsapp-fab:hover~.whatsapp-tooltip{opacity:1;transform:translateY(0)}@keyframes waPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  </style>
</head>
<body>
  <header class="navbar" id="navbar" x-data="{ mobileOpen: false }">
    <div class="navbar-inner">
      <button class="navbar-burger" @click="mobileOpen = !mobileOpen" :aria-label="$store.lang.t('nav.menu')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="/" class="navbar-logo"><span class="logo-main">IRONFUEL</span><span class="logo-sub">NUTRITION</span></a>
      <nav class="navbar-links" :class="{ 'is-open': mobileOpen }">
        <a href="/" class="navbar-link" x-text="$store.lang.t('nav.home')"></a>
        <a href="/shop.html" class="navbar-link" x-text="$store.lang.t('nav.shop')"></a>
        <a href="/deals.html" class="navbar-link" x-text="$store.lang.t('nav.offers')"></a>
        <a href="/about.html" class="navbar-link" x-text="$store.lang.t('nav.about')"></a>

      </nav>
      <div class="navbar-actions">
        <a href="/cart" class="navbar-icon-btn" :aria-label="$store.lang.t('nav.cart')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" x-text="$store.cart.count" x-show="$store.cart.count > 0" x-cloak>0</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="page-hero">
      <h1 x-text="$store.lang.t('deals.title')"></h1>
      <p x-text="$store.lang.t('deals.desc')"></p>
    </div>

    <div x-data="dealsData()">
      <!-- Loading -->
      <div class="skeleton-grid" x-show="loading">
        <template x-for="i in 3"><div class="skel"><div class="skel-img"></div><div class="skel-body"><div class="skel-line w60"></div><div class="skel-line w80"></div><div class="skel-line w40"></div></div></div></template>
      </div>
      <!-- Empty -->
      <div class="empty" x-show="!loading && deals.length === 0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/></svg>
        <h3 x-text="$store.lang.t('deals.empty')"></h3>
        <p x-text="$store.lang.t('deals.emptyDesc')"></p>
      </div>
      <!-- Deals -->
      <div class="deals-grid" x-show="!loading && deals.length > 0">
        <template x-for="d in deals" :key="d.id">
          <div class="deal-card">
            <div class="deal-img" x-show="d.image"><img :src="d.image" :alt="d.name" loading="lazy"/></div>
            <div class="deal-body">
              <div class="deal-tag">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/></svg>
                <span x-text="$store.lang.t('deals.bundleDeal')"></span>
              </div>
              <p class="deal-name" x-text="d.name"></p>
              <p class="deal-desc" x-text="(d.description||'').substring(0,120)+(d.description&&d.description.length>120?'...':'')"></p>
              <div class="deal-prices">
                <span class="deal-price" x-text="Number(d.price||0).toLocaleString()+' '+$store.lang.t('currency')"></span>
                <span class="deal-original" x-show="(d.original_price||0)>0" x-text="Number(d.original_price).toLocaleString()+' '+$store.lang.t('currency')"></span>
                <span class="deal-save" x-show="(d.original_price||0)>d.price" x-text="$store.lang.t('deals.save')+' '+Number(d.original_price-d.price).toLocaleString()+' '+$store.lang.t('currency')"></span>
              </div>
              <a :href="'/pack.html?id='+d.id" class="deal-btn" x-text="$store.lang.t('deals.viewDeal')"></a>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('dealsData', () => ({
        deals: [], loading: true,
        async init() {
          try {
            const r = await fetch('/api/packs');
            if (r.ok) this.deals = await r.json();
          } catch (e) { console.error(e); }
          finally { this.loading = false; }
        }
      }));
    });
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 10);
    });
  </script>
  <a id="whatsapp-fab" class="whatsapp-fab" href="#" target="_blank" rel="noopener" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>
  <div id="whatsapp-tooltip" class="whatsapp-tooltip" x-data x-text="$store.lang.t('whatsapp.tooltip')"></div>
  <script>
    fetch('/api/store-info').then(r=>r.json()).then(d=>{
      if(d.whatsapp){
        var fab=document.getElementById('whatsapp-fab');fab.href=d.whatsapp;fab.style.display='flex';
        var tip=document.getElementById('whatsapp-tooltip');
        (function loop(){setTimeout(function(){tip.classList.add('show');fab.classList.add('pulse');setTimeout(function(){tip.classList.remove('show');fab.classList.remove('pulse');loop()},3500)},5000)})();
      }
    }).catch(()=>{});
  </script>
  <div class="lang-switcher" x-data dir="ltr">
    <button @click="$store.lang.set('en')" :class="{ active: $store.lang.current === 'en' }"><img src="/assets/flags-icon/united-kingdom.svg" alt="EN"></button>
    <button @click="$store.lang.set('ar')" :class="{ active: $store.lang.current === 'ar' }"><img src="/assets/flags-icon/Algeria.svg" alt="AR"></button>
    <button @click="$store.lang.set('fr')" :class="{ active: $store.lang.current === 'fr' }"><img src="/assets/flags-icon/france.svg" alt="FR"></button>
  </div>
</body>
</html>
