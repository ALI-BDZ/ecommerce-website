<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Ecommerce</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    button{font-family:inherit}
    html,body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0d0d0d;line-height:1.6;-webkit-font-smoothing:antialiased;background:#f4f4f6;height:100%}
    :root{
      --bg:#f4f4f6;--bg-card:#fff;--bg-alt:#f0f0f2;
      --text:#0d0d0d;--text-muted:#8a8a8e;--text-subtle:#b0b0b4;
      --border:#e8e8ed;--border-light:#f0f0f2;
      --accent:#7c3aed;--accent-soft:#f5f3ff;
      --green:#10b981;--green-soft:#ecfdf5;--red:#ef4444;--red-soft:#fef2f2;--orange:#f59e0b;--orange-soft:#fffbeb;--blue:#3b82f6;--blue-soft:#eff6ff;
      --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
      --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;
      --sh-sm:0 1px 3px rgba(0,0,0,.04);--sh-md:0 4px 16px rgba(0,0,0,.06);--sh-lg:0 8px 30px rgba(0,0,0,.08);
      --fast:150ms ease;--base:300ms ease;
      --sidebar-w:240px;--nav-h:64px;
    }
    [x-cloak]{display:none!important}
    body{overflow:hidden}

    .app{display:flex;height:100vh}

    .sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0c0c14 0%,#0a0a12 100%);display:flex;flex-direction:column;flex-shrink:0;position:relative;z-index:10}
    .sidebar-brand{display:flex;align-items:center;gap:var(--s3);padding:var(--s5) var(--s5);border-bottom:1px solid rgba(255,255,255,.05)}
    .sidebar-brand .brand-icon{width:32px;height:32px;background:linear-gradient(135deg,#a78bfa,#7c3aed);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center}
    .sidebar-brand .brand-icon svg{width:16px;height:16px;color:#fff}
    .sidebar-brand span{font-size:15px;font-weight:800;letter-spacing:-.03em;color:#fff}
    .sidebar-nav{flex:1;padding:var(--s3);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
    .sidebar-nav::-webkit-scrollbar{width:3px}
    .sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
    .nav-item{display:flex;align-items:center;gap:var(--s3);padding:10px 14px;border-radius:var(--r-md);font-size:13px;font-weight:500;color:rgba(255,255,255,.35);cursor:pointer;transition:all var(--fast);border:none;background:none;font-family:inherit;text-align:left;width:100%}
    .nav-item:hover{color:rgba(255,255,255,.65);background:rgba(255,255,255,.04)}
    .nav-item.active{color:#fff;background:rgba(167,139,250,.12);box-shadow:inset 2px 0 0 #a78bfa}
    .nav-item svg{width:18px;height:18px;flex-shrink:0}
    .nav-item .nav-badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;min-width:18px;text-align:center}
    .sidebar-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.15);padding:var(--s4) var(--s4) var(--s1);margin-top:var(--s2)}
    .sidebar-footer{padding:var(--s3);margin-top:auto;border-top:1px solid rgba(255,255,255,.05)}
    .nav-item.logout{color:rgba(255,255,255,.25)}
    .nav-item.logout:hover{color:#f87171;background:rgba(248,113,113,.08)}

    .main{flex:1;display:flex;flex-direction:column;min-width:0}
    .content{flex:1;overflow-y:auto;padding:var(--s6);padding-top:var(--s5)}
    .content::-webkit-scrollbar{width:5px}
    .content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes barGrow{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}

    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s5)}
    .page-header{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4) var(--s5);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s5);box-shadow:var(--sh-sm)}
    .topbar h1{font-size:20px;font-weight:700;letter-spacing:-.03em}
    .topbar p{font-size:13px;color:var(--text-muted);margin-top:2px}
    .topbar-right{display:flex;align-items:center;gap:var(--s3);position:relative}
    .notif-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:none;background:var(--bg-card);cursor:pointer;color:var(--text-muted);transition:all var(--fast);position:relative;box-shadow:var(--sh-sm)}
    .notif-btn:hover{background:var(--accent-soft);color:var(--accent)}
    .notif-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--bg-card)}
    .notif-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:360px;background:var(--bg-card);border-radius:var(--r-lg);box-shadow:var(--sh-lg);border:1px solid var(--border);z-index:100;display:none;max-height:400px;overflow-y:auto}
    .notif-dropdown.open{display:block;animation:dropIn .2s ease}
    @keyframes dropIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    .notif-header{padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);display:flex;align-items:center;justify-content:space-between}
    .notif-item{padding:var(--s3) var(--s4);display:flex;gap:var(--s3);align-items:flex-start;transition:background var(--fast);cursor:pointer;border-bottom:1px solid var(--border-light)}
    .notif-item:last-child{border-bottom:none}
    .notif-item:hover{background:var(--bg-alt)}
    .notif-item.unread{background:var(--accent-soft)}
    .notif-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700}
    .notif-body{flex:1;min-width:0}
    .notif-title{font-size:13px;font-weight:600;color:var(--text)}
    .notif-time{font-size:11px;color:var(--text-muted);margin-top:2px}

    .welcome{background:linear-gradient(135deg,#0c0c14,#1a1a2e);border-radius:var(--r-xl);padding:var(--s5) var(--s6);margin-bottom:var(--s5);position:relative;overflow:hidden}
    .welcome::before{content:'';position:absolute;top:-50%;right:-20%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.12),transparent 70%)}
    .welcome::after{content:'';position:absolute;bottom:-40%;left:30%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.08),transparent 70%)}
    .welcome h2{font-size:18px;font-weight:700;color:#fff;position:relative;z-index:1}
    .welcome p{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;position:relative;z-index:1}
    .welcome-stats{display:flex;gap:var(--s6);margin-top:var(--s4);position:relative;z-index:1}
    .welcome-stat{text-align:center}
    .welcome-stat .val{font-size:22px;font-weight:800;color:#a78bfa;letter-spacing:-.03em}
    .welcome-stat .lbl{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px}

    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s4)}
    .kpi-card{background:var(--bg-card);border-radius:var(--r-lg);padding:var(--s5);border:1px solid var(--border);transition:all var(--fast);position:relative;overflow:hidden}
    .kpi-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
    .kpi-card .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--s3)}
    .kpi-card .kpi-icon{width:40px;height:40px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .kpi-card .kpi-icon svg{width:18px;height:18px}
    .kpi-card .kpi-trend{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
    .kpi-card .kpi-trend.up{background:var(--green-soft);color:#059669}
    .kpi-card .kpi-trend.down{background:var(--red-soft);color:#dc2626}
    .kpi-card .kpi-label{font-size:12px;font-weight:500;color:var(--text-muted)}
    .kpi-card .kpi-value{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:var(--s1)}
    .kpi-card .kpi-sub{font-size:12px;color:var(--text-muted);margin-top:var(--s1)}

    .row{display:grid;grid-template-columns:2fr 1fr;gap:var(--s4);margin-bottom:var(--s5)}
    .card{background:var(--bg-card);border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden}
    .card-header{display:flex;align-items:center;justify-content:space-between;padding:var(--s4) var(--s5);border-bottom:1px solid var(--border)}
    .card-header h3{font-size:14px;font-weight:700}
    .card-header a{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;transition:opacity var(--fast);cursor:pointer}
    .card-header a:hover{opacity:.7}
    .card-body{padding:var(--s5)}
    .card-body.no-pad{padding:0}

    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:var(--s3) var(--s5);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);border-bottom:1px solid var(--border);background:var(--bg-alt)}
    td{padding:var(--s3) var(--s5);border-bottom:1px solid var(--border-light);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:var(--bg-alt)}

    .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;text-transform:capitalize}
    .badge-pending{background:var(--orange-soft);color:#d97706}
    .badge-confirmed{background:var(--blue-soft);color:#2563eb}
    .badge-processing{background:var(--blue-soft);color:#2563eb}
    .badge-shipped{background:var(--accent-soft);color:var(--accent)}
    .badge-delivered{background:var(--green-soft);color:#059669}
    .badge-cancelled{background:var(--red-soft);color:#dc2626}
    .badge-active{background:var(--green-soft);color:#059669}
    .badge-inactive{background:var(--red-soft);color:#dc2626}

    .rev-chart-wrap{display:flex;height:200px;gap:6px;padding:0}
    .rev-yaxis{display:flex;flex-direction:column;justify-content:space-between;width:44px;flex-shrink:0;padding:0}
    .rev-yaxis span{font-size:9px;font-weight:600;color:var(--text-muted);text-align:right;line-height:1}
    .rev-bars-wrap{flex:1;position:relative;display:flex;align-items:flex-end;gap:2px;padding-bottom:20px}
    .rev-gridlines{position:absolute;top:0;left:0;right:0;bottom:20px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
    .rev-gridlines .gl{width:100%;border-bottom:1px solid var(--border-light);height:0}
    .rev-bars-wrap .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative;z-index:1;animation:barGrow .6s cubic-bezier(.16,1,.3,1) both}
    .rev-bars-wrap .bar{width:100%;max-width:28px;border-radius:3px 3px 0 0;min-height:2px;transition:height .6s cubic-bezier(.16,1,.3,1);position:relative;cursor:pointer}
    .rev-bars-wrap .bar.has-value{background:linear-gradient(180deg,#7c3aed,#6d28d9)}
    .rev-bars-wrap .bar.zero{background:var(--border);opacity:.5}
    .rev-bars-wrap .bar:hover{opacity:.85;filter:brightness(1.1)}
    .rev-bars-wrap .bar-label{font-size:8px;color:var(--text-muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32px;text-align:center;position:absolute;bottom:-18px}
    .chart-tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#0c0c14;color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;margin-bottom:4px;z-index:10}
    .bar:hover .chart-tooltip{opacity:1}

    .status-donut{display:flex;flex-direction:column;gap:var(--s3)}
    .status-row{display:flex;align-items:center;gap:var(--s3)}
    .status-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .status-row .lbl{flex:1;font-size:13px;color:var(--text-muted)}
    .status-row .val{font-size:13px;font-weight:700}
    .status-row .bar-bg{flex:1;height:6px;background:var(--bg-alt);border-radius:999px;overflow:hidden}
    .status-row .bar-fill{height:100%;border-radius:999px;transition:width .8s ease}

    .alert-item{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--border-light)}
    .alert-item:last-child{border-bottom:none}
    .alert-item .alert-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:700}
    .alert-item .alert-body{flex:1}
    .alert-item .alert-body .title{font-size:13px;font-weight:600}
    .alert-item .alert-body .desc{font-size:12px;color:var(--text-muted);margin-top:1px}

    .filters{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}

    .filter-control{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4);height:38px;border-radius:999px;border:1px solid var(--border);background:var(--bg-card);transition:all var(--fast);cursor:pointer;position:relative}
    .filter-control:focus-within,.filter-control:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.1);outline:none}
    .filter-control:hover{border-color:var(--text-subtle)}
    .filter-control input{border:none;background:none;outline:none;font-size:13px;font-family:inherit;color:var(--text);width:180px;line-height:1}
    .filter-control input::placeholder{color:var(--text-subtle)}
    .filter-control .search-icon{width:16px;height:16px;color:var(--text-muted);flex-shrink:0;display:block}
    .filter-control .arrow{display:flex;align-items:center;transition:transform .25s cubic-bezier(.16,1,.3,1);color:var(--text-muted);flex-shrink:0}
    .filter-control .arrow.open{transform:rotate(180deg)}
    .filter-control .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:block}
    .filter-control .sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
    .filter-trigger{display:flex;align-items:center;gap:var(--s2);height:36px;padding:0 var(--s4);border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-card);font-size:12px;font-weight:500;font-family:inherit;color:var(--text);cursor:pointer;transition:all var(--fast);position:relative;white-space:nowrap;min-width:120px}
    .filter-trigger:hover{border-color:var(--accent);background:var(--bg-alt)}
    .filter-trigger.open{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.1);background:var(--bg-card)}
    .filter-trigger .val{flex:1;text-align:left}
    .filter-trigger .placeholder{color:var(--text-muted)}
    .filter-trigger .arrow{display:flex;align-items:center;transition:transform .25s cubic-bezier(.16,1,.3,1);color:var(--text-muted)}
    .filter-trigger.open .arrow{transform:rotate(180deg)}
    .filter-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:100%;background:var(--bg-card);border-radius:var(--r-md);box-shadow:0 12px 48px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.04);z-index:200;padding:var(--s1);display:none;max-height:260px;overflow-y:auto;transform-origin:top center}
    .filter-dropdown.open{display:block;animation:dropReveal .2s cubic-bezier(.16,1,.3,1) both}
    .filter-dropdown .opt{display:flex;align-items:center;gap:var(--s2);padding:9px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--text);cursor:pointer;transition:all .15s;border:none;background:none;font-family:inherit;width:100%;text-align:left}
    .filter-dropdown .opt:hover{background:var(--bg-alt);transform:translateX(4px)}
    .filter-dropdown .opt.selected{background:var(--accent-soft);color:var(--accent);font-weight:600}
    .filter-dropdown .opt .opt-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .filter-dropdown .opt .check{color:var(--accent);margin-left:auto;opacity:0;transition:opacity .15s;display:flex}
    .filter-dropdown .opt.selected .check{opacity:1}
    .prod-card .card-actions{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2);opacity:0;transform:translateY(4px);transition:all .25s cubic-bezier(.16,1,.3,1)}
    .prod-card:hover .card-actions{opacity:1;transform:translateY(0)}
    .card-toggle-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid transparent;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;height:28px;flex-shrink:0}
    .card-toggle-btn.active{background:var(--green-soft);color:#059669;border-color:rgba(5,150,105,.2)}
    .card-toggle-btn.draft{background:var(--orange-soft);color:#d97706;border-color:rgba(217,119,6,.2)}
    .card-toggle-btn:hover{transform:scale(1.05);box-shadow:0 2px 6px rgba(0,0,0,.1)}
    .card-toggle-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

    .dropdown-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:210px;background:var(--bg-card);border-radius:var(--r-md);box-shadow:0 12px 48px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.04);z-index:200;padding:var(--s1);display:none;overflow:hidden;transform-origin:top left}
    .dropdown-menu.open{display:block;animation:dropReveal .25s cubic-bezier(.16,1,.3,1) both}
    @keyframes dropReveal{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    .dropdown-option{display:flex;align-items:center;gap:var(--s2);padding:10px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--text);cursor:pointer;transition:background .12s;border:none;background:none;font-family:inherit;width:100%;text-align:left}
    .dropdown-option:hover{background:var(--bg-alt)}
    .dropdown-option.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
    .dropdown-option .opt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:block}
    .dropdown-option .opt-label{flex:1}
    .dropdown-option .opt-check{color:var(--accent);opacity:0;transition:opacity .15s}
    .dropdown-option.active .opt-check{opacity:1}
    .dropdown-divider{height:1px;background:var(--border-light);margin:var(--s1) 0}

    .pagination{display:flex;align-items:center;justify-content:center;gap:var(--s2);padding:var(--s4)}
    .page-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:12px;font-weight:600;color:var(--text-muted);transition:all var(--fast);font-family:inherit}
    .page-btn:hover{border-color:var(--accent);color:var(--accent)}
    .page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .page-btn:disabled{opacity:.3;cursor:default;pointer-events:none}
    .page-info{font-size:12px;color:var(--text-muted);margin:0 var(--s1)}

    .empty-state{text-align:center;padding:var(--s8) var(--s5);color:var(--text-muted)}

    .slideover{position:fixed;inset:0;z-index:1000;display:none}
    .slideover.open{display:block}
    .slideover .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fadeIn .2s}
    .slideover .panel{position:absolute;top:0;right:0;bottom:0;width:640px;max-width:100vw;background:var(--bg);box-shadow:-8px 0 40px rgba(0,0,0,.1);display:flex;flex-direction:column;animation:panelSlide .3s cubic-bezier(.16,1,.3,1)}
    @keyframes panelSlide{from{transform:translateX(100%)}to{transform:translateX(0)}}
    .slideover .panel-header{display:flex;align-items:center;justify-content:space-between;padding:var(--s5);border-bottom:1px solid var(--border);flex-shrink:0}
    .slideover .panel-header h2{font-size:16px;font-weight:700}
    .slideover .panel-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:none;background:var(--bg-alt);cursor:pointer;color:var(--text-muted);transition:all var(--fast)}
    .slideover .panel-close:hover{background:var(--red-soft);color:var(--red)}
    .slideover .panel-body{flex:1;overflow-y:auto;padding:var(--s5)}
    .slideover .panel-footer{display:flex;align-items:center;justify-content:flex-end;gap:var(--s3);padding:var(--s4) var(--s5);border-top:1px solid var(--border);flex-shrink:0}
    .slideover .panel-body::-webkit-scrollbar{width:5px}
    .slideover .panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
    .form-grid .full{grid-column:1/-1}
    .form-block{margin-bottom:var(--s4)}.form-block label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:var(--s1)}
    .form-block .field{width:100%;height:40px;padding:0 var(--s3);border-radius:var(--r-md);border:1px solid var(--border);font-size:13px;font-family:inherit;background:var(--bg-alt);color:var(--text);outline:none;transition:all var(--fast)}
    .form-block .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.1);background:var(--bg-card)}
    .form-block textarea.field{height:auto;padding:var(--s3);resize:vertical;min-height:80px;line-height:1.5}
    .form-block .field-sm{height:36px;font-size:12px}
    .form-block select.field{cursor:pointer}
    .field-dropdown{position:relative}
    .field-dropdown .trigger{width:100%;height:42px;padding:0 var(--s4);border-radius:var(--r-md);border:1px solid var(--border);font-size:13px;font-weight:500;font-family:inherit;background:var(--bg-card);color:var(--text);outline:none;transition:all var(--fast);cursor:pointer;display:flex;align-items:center;gap:var(--s2);-webkit-appearance:none;appearance:none}
    .field-dropdown .trigger:hover{border-color:var(--text-subtle)}
    .field-dropdown .trigger:focus,.field-dropdown.open .trigger{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.1);background:var(--bg-card)}
    .field-dropdown .trigger .val{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .field-dropdown .trigger .placeholder{color:var(--text-muted)}
    .field-dropdown .trigger .arrow{display:flex;align-items:center;transition:transform .25s cubic-bezier(.16,1,.3,1);color:var(--text-muted);flex-shrink:0}
    .field-dropdown.open .trigger .arrow{transform:rotate(180deg)}
    .field-dropdown .menu{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:0;background:var(--bg-card);border-radius:var(--r-md);box-shadow:0 12px 48px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.04);z-index:300;padding:var(--s1);display:none;max-height:240px;overflow-y:auto;transform-origin:top center}
    .field-dropdown.open .menu{display:block;animation:dropReveal .2s cubic-bezier(.16,1,.3,1) both}
    .field-dropdown .menu .search{padding:var(--s1);position:sticky;top:0;background:var(--bg-card);z-index:1}
    .field-dropdown .menu .search input{width:100%;height:34px;padding:0 var(--s3);border-radius:var(--r-sm);border:1px solid var(--border);font-size:12px;font-family:inherit;background:var(--bg-alt);color:var(--text);outline:none;transition:all var(--fast)}
    .field-dropdown .menu .search input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,58,237,.1)}
    .field-dropdown .opt{display:flex;align-items:center;gap:var(--s2);padding:9px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--text);cursor:pointer;transition:background .12s;border:none;background:none;font-family:inherit;width:100%;text-align:left}
    .field-dropdown .opt:hover{background:var(--bg-alt)}
    .field-dropdown .opt.selected{background:var(--accent-soft);color:var(--accent);font-weight:600}
    .field-dropdown .opt .check{color:var(--accent);margin-left:auto;opacity:0;transition:opacity .15s;display:flex}
    .field-dropdown .opt.selected .check{opacity:1}
    .field-dropdown .opt .opt-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .field-dropdown .opt-empty{padding:var(--s5);text-align:center;color:var(--text-muted);font-size:12px}
    .field-dropdown .divider{height:1px;background:var(--border-light);margin:var(--s1) 0}
    .field-dropdown .opt-add{display:flex;align-items:center;gap:var(--s2);padding:9px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;transition:background .12s;border:none;background:none;font-family:inherit;width:100%;text-align:left}
    .field-dropdown .opt-add:hover{background:var(--accent-soft)}

    .row{display:grid;grid-template-columns:2fr 1fr;gap:var(--s4);margin-bottom:var(--s5)}
    .toggle{position:relative;width:36px;height:20px;background:var(--border);border-radius:999px;cursor:pointer;transition:all var(--fast);flex-shrink:0;border:none;padding:0}
    .toggle.active{background:var(--accent)}.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:all var(--fast);box-shadow:0 1px 3px rgba(0,0,0,.15)}
    .toggle.active::after{left:18px}
    .form-row{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2);padding:8px var(--s3);background:var(--bg-alt);border-radius:var(--r-md);border:1px solid var(--border-light)}
    .form-row .toggle-label{font-size:13px;font-weight:600;color:var(--text);flex-shrink:0;min-width:100px}
    .form-row .toggle-desc{font-size:11px;color:var(--text-muted);text-align:right}

    .upload-zone{border:2px dashed var(--border);border-radius:var(--r-md);padding:var(--s6);text-align:center;cursor:pointer;transition:all var(--fast);background:var(--bg-alt)}
    .upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--accent-soft)}
    .upload-zone svg{width:32px;height:32px;color:var(--text-muted);margin-bottom:var(--s2)}
    .upload-zone p{font-size:13px;color:var(--text-muted)}
    .upload-preview{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
    .upload-preview .thumb{width:72px;height:72px;border-radius:var(--r-md);overflow:hidden;position:relative;border:1px solid var(--border)}
    .upload-preview .thumb img{width:100%;height:100%;object-fit:cover}
    .upload-preview .thumb .remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--fast)}
    .upload-preview .thumb:hover .remove{opacity:1}
    .upload-progress{height:3px;background:var(--bg-alt);border-radius:999px;margin-top:var(--s2);overflow:hidden;display:none}
    .upload-progress .bar{height:100%;background:var(--accent);border-radius:999px;transition:width .3s;width:0}

    .btn-primary{height:38px;padding:0 var(--s5);border-radius:999px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all var(--fast);display:inline-flex;align-items:center;gap:var(--s2)}
    .btn-primary:hover{opacity:.9}
    .btn-primary:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
    .btn-primary.loading .btn-text{opacity:.5}
    .btn-primary .spinner{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    .btn-primary.loading .spinner{display:inline-block}
    .btn-icon{display:inline-flex;align-items:center;justify-content:center;border:none;background:var(--bg-alt);color:var(--text-muted);cursor:pointer;border-radius:var(--r-sm);transition:all var(--fast);font-family:inherit}
    .btn-icon:hover{background:var(--border);color:var(--text)}
    .upload-zone-sm{display:inline-flex;align-items:center;justify-content:center;padding:0 var(--s4);height:38px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-alt);cursor:pointer;font-size:12px;color:var(--text-muted);transition:all var(--fast);font-family:inherit}
    .upload-zone-sm:hover{background:var(--border);color:var(--text)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .btn-secondary{height:38px;padding:0 var(--s5);border-radius:999px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all var(--fast)}
    .btn-secondary:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
    .btn-secondary:active{transform:translateY(0)}
    .empty-state svg{width:48px;height:48px;margin-bottom:var(--s4);opacity:.3}
    .empty-state p{font-size:14px}

    .bs-item{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0}
    .bs-rank{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .bs-body{flex:1;min-width:0}
    .bs-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bs-bar-bg{height:4px;background:var(--bg-alt);border-radius:4px;margin-top:4px;overflow:hidden}
    .bs-bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .8s cubic-bezier(.16,1,.3,1)}
    .bs-val{font-size:12px;font-weight:700;white-space:nowrap;color:var(--text-muted);text-align:right;min-width:70px}

    .cat-row{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 0}
    .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .cat-name{font-size:12px;font-weight:500;width:80px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cat-bar-bg{flex:1;height:6px;background:var(--bg-alt);border-radius:4px;overflow:hidden}
    .cat-bar-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.16,1,.3,1)}
    .cat-pct{font-size:11px;font-weight:600;min-width:36px;text-align:right;color:var(--text-muted)}
    .cat-val{font-size:11px;font-weight:700;min-width:28px;text-align:right}

    .cust-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--border-light)}
    .cust-row:last-child{border-bottom:none}
    .cust-rank{width:20px;font-size:11px;font-weight:700;color:var(--text-muted);text-align:center}
    .cust-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
    .cust-info{flex:1;min-width:0}
    .cust-name{font-size:12px;font-weight:600}
    .cust-phone{font-size:11px;color:var(--text-muted)}
    .cust-val{text-align:right;font-size:12px;font-weight:700}
    .cust-sub{font-size:10px;color:var(--text-muted)}
    .cust-risk{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-left:var(--s2)}

    .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s4);margin-bottom:var(--s6)}
    @media(max-width:1100px){.row-3{grid-template-columns:1fr 1fr}}
    @media(max-width:768px){.row-3{grid-template-columns:1fr}}

    .kpi-more{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s3);margin-bottom:var(--s5)}
    .kpi-mini{background:var(--bg-card);border-radius:var(--r-md);padding:var(--s4);border:1px solid var(--border);text-align:center}
    .kpi-mini .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
    .kpi-mini .val{font-size:18px;font-weight:800;letter-spacing:-.03em;margin-top:var(--s1)}
    .kpi-mini .sub{font-size:10px;color:var(--text-muted);margin-top:2px}

    .accordion-toggle{display:flex;align-items:center;gap:var(--s2);cursor:pointer;background:none;border:none;font-family:inherit;font-size:13px;font-weight:700;padding:var(--s3) var(--s5);width:100%;text-align:left;color:var(--text);transition:background var(--fast)}
    .accordion-toggle:hover{background:var(--bg-alt)}
    .accordion-toggle svg{width:14px;height:14px;transition:transform .25s cubic-bezier(.16,1,.3,1);color:var(--text-muted)}
    .accordion-toggle.open svg{transform:rotate(90deg)}
    .accordion-body{padding:0 var(--s5) var(--s4)}
    .insight-item{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0;font-size:13px;color:var(--text)}
    .insight-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700}
    @media(max-width:1100px){
      .kpi-grid{grid-template-columns:repeat(2,1fr)}
      .row{grid-template-columns:1fr}
    }
    .mobile-menu-btn{display:none;width:38px;height:38px;align-items:center;justify-content:center;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-card);cursor:pointer;color:var(--text-muted);transition:all var(--fast);flex-shrink:0}
    .mobile-menu-btn:hover{color:var(--accent);border-color:var(--accent)}
    .sidebar-backdrop{display:none}

    .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s4)}
    .prod-card{background:var(--bg-card);border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:all var(--fast);display:flex;flex-direction:column}
    .prod-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
    .prod-card-img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--bg-alt);padding:var(--s2)}
    .prod-card-body{padding:var(--s4);display:flex;flex-direction:column;flex:1}
    .prod-card-name{font-size:14px;font-weight:700;margin-bottom:2px}
    .prod-card-sku{font-size:11px;color:var(--text-muted);margin-bottom:var(--s2)}
    .prod-card-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
    .prod-card-price{font-size:16px;font-weight:800}
    .prod-card-stock{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
    .prod-card-stock.ok{background:var(--green-soft);color:#059669}
    .prod-card-stock.low{background:var(--orange-soft);color:#d97706}
    .prod-card-stock.out{background:var(--red-soft);color:#dc2626}
    .prod-card-brand{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)}
    .pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s4)}
    .pack-card{background:var(--bg-card);border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;transition:all var(--fast);display:flex;flex-direction:column}
    .pack-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
    .pack-card-img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg-alt)}
    .pack-card-body{padding:var(--s4);display:flex;flex-direction:column;flex:1}
    .pack-card-name{font-size:14px;font-weight:700;margin-bottom:2px}
    .pack-card-desc{font-size:12px;color:var(--text-muted);margin-bottom:var(--s2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .pack-card-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:var(--s2);border-top:1px solid var(--border)}
    .pack-card-price{font-size:16px;font-weight:800}
    .pack-card-days{font-size:11px;color:var(--text-muted)}
    .pack-card-actions{display:flex;gap:var(--s1);padding:var(--s2) var(--s4) var(--s4)}

    /* ── Product Workspace ── */
    .pw-sticky{position:sticky;top:0;z-index:20;background:rgba(244,244,246,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:calc(var(--s6)*-1);margin-bottom:0;padding:var(--s4) var(--s6);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);animation:fadeIn .3s}
    .pw-sticky-left{display:flex;align-items:center;gap:var(--s3)}
    .pw-sticky-right{display:flex;align-items:center;gap:var(--s3)}
    .pw-back{display:inline-flex;align-items:center;gap:var(--s2);font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border:none;background:none;font-family:inherit;transition:color var(--fast);padding:6px 10px;border-radius:var(--r-sm)}
    .pw-back:hover{color:var(--text);background:var(--bg-alt)}
    .pw-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .pw-badge-published{background:var(--green-soft);color:#059669}
    .pw-badge-draft{background:var(--orange-soft);color:#d97706}
    .pw-badge-archived{background:var(--red-soft);color:#dc2626}
    .pw-badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .pw-toggle-btn{border:none;cursor:pointer;transition:all .2s;font-family:inherit}
    .pw-toggle-btn:hover{transform:scale(1.05);box-shadow:0 2px 8px rgba(0,0,0,.12)}
    .pw-id{font-size:11px;color:var(--text-subtle);font-weight:500}
    .pw-body{display:grid;grid-template-columns:1fr 340px;gap:var(--s5);padding-top:var(--s5);animation:fadeIn .3s}
    .pw-main{min-width:0;display:flex;flex-direction:column;gap:var(--s4)}
    .pw-sidebar{display:flex;flex-direction:column;gap:var(--s4)}
    .pw-card{background:var(--bg-card);border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden}
    .pw-card-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s4) var(--s5);border-bottom:1px solid var(--border-light)}
    .pw-card-head h3{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.01em}
    .pw-card-head .pw-card-hint{font-size:11px;color:var(--text-muted);font-weight:400}
    .pw-card-body{padding:var(--s5)}
    .pw-fld{margin-bottom:var(--s4)}
    .pw-fld:last-child{margin-bottom:0}
    .pw-fld label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px}
    .pw-inp{width:100%;height:40px;padding:0 var(--s3);border-radius:var(--r-md);border:1px solid var(--border);font-size:13px;font-family:inherit;background:var(--bg-alt);color:var(--text);outline:none;transition:all var(--fast)}
    .pw-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.1);background:var(--bg-card)}
    .pw-inp-sm{height:36px;font-size:12px}
    .pw-textarea{min-height:100px;padding:var(--s3);resize:vertical;line-height:1.5}
    .pw-price-display{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--text)}
    .pw-price-compare{font-size:13px;color:var(--text-muted);text-decoration:line-through;margin-left:var(--s2)}
    .pw-margin{font-size:12px;font-weight:600;color:var(--green);margin-top:var(--s1)}
    .pw-stock-row{display:flex;align-items:center;gap:var(--s3)}
    .pw-stock-num{font-size:24px;font-weight:800;letter-spacing:-.03em}
    .pw-stock-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
    .pw-stock-bar{height:4px;background:var(--bg-alt);border-radius:999px;overflow:hidden;margin-top:var(--s2)}
    .pw-stock-fill{height:100%;border-radius:999px;transition:width .6s ease}
    .pw-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
    .pw-stat{background:var(--bg-alt);border-radius:var(--r-md);padding:var(--s3);text-align:center}
    .pw-stat .v{font-size:16px;font-weight:800;letter-spacing:-.02em}
    .pw-stat .l{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
    .pw-img-main{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:1;cursor:pointer;border:2px dashed var(--border);transition:all var(--fast);background:var(--bg-alt)}
    .pw-img-main:hover{border-color:var(--accent);background:var(--accent-soft)}
    .pw-img-main img{width:100%;height:100%;object-fit:cover}
    .pw-img-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity var(--fast)}
    .pw-img-main:hover .pw-img-overlay{opacity:1}
    .pw-img-overlay svg{width:28px;height:28px;margin-bottom:var(--s2)}
    .pw-img-overlay span{font-size:12px;font-weight:600}
    .pw-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
    .pw-gallery-add{aspect-ratio:1;border:2px dashed var(--border);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--fast);color:var(--text-muted);background:var(--bg-alt)}
    .pw-gallery-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
    .pw-toggle-row{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--border-light)}
    .pw-toggle-row:last-child{border-bottom:none}
    .pw-toggle-row .lbl{font-size:13px;font-weight:500;flex:1}
    .pw-section-row{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--border-light)}
    .pw-section-row:last-child{border-bottom:none}
    .pw-section-row .lbl{font-size:13px;font-weight:500;flex:1}
    .pw-section-row .desc{font-size:11px;color:var(--text-muted)}
    .pw-section-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px}
    .pw-section-status.on{background:var(--green-soft);color:#059669}
    .pw-section-status.off{background:var(--bg-alt);color:var(--text-muted)}
    .pw-dropzone{border:2px dashed var(--border);border-radius:var(--r-lg);padding:var(--s6);text-align:center;cursor:pointer;transition:all var(--fast);background:var(--bg-alt)}
    .pw-dropzone:hover,.pw-dropzone.dragover{border-color:var(--accent);background:var(--accent-soft)}
    .pw-dropzone p{font-size:13px;color:var(--text-muted)}
    .pw-thumb{position:relative;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border)}
    .pw-thumb img{width:100%;aspect-ratio:1;object-fit:cover}
    .pw-thumb .rm{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--fast)}
    .pw-thumb:hover .rm{opacity:1}
    .pw-unsaved{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:var(--s3) var(--s6);display:none;align-items:center;justify-content:space-between;animation:slideUp .3s ease}
    .pw-unsaved.show{display:flex}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .pw-unsaved .msg{font-size:13px;font-weight:600;color:var(--text)}
    .pw-unsaved .actions{display:flex;gap:var(--s2)}
    .pw-health{display:flex;flex-direction:column;gap:var(--s2)}
    .pw-health-row{display:flex;align-items:center;gap:var(--s3);font-size:12px}
    .pw-health-row .icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
    .pw-health-row .icon.ok{background:var(--green-soft);color:#059669}
    .pw-health-row .icon.miss{background:var(--red-soft);color:#dc2626}
    .pw-health-row .label{flex:1;color:var(--text-muted)}
    .pw-health-row .score{font-weight:700}
    .pw-score-bar{height:6px;background:var(--bg-alt);border-radius:999px;overflow:hidden;margin-top:var(--s2)}
    .pw-score-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#a78bfa);transition:width .8s ease}
    .pw-detail-input{display:none}
    @media(max-width:1100px){
      .pw-body{grid-template-columns:1fr}
      .pw-sidebar{order:-1}
    }
    @media(max-width:768px){
      .mobile-menu-btn{display:flex}
      .sidebar{display:flex;position:fixed;top:0;left:0;bottom:0;z-index:500;transform:translateX(-100%);transition:transform .3s cubic-bezier(.16,1,.3,1)}
      .sidebar.mobile-open{transform:translateX(0)}
      .sidebar-backdrop{display:block;position:fixed;inset:0;z-index:499;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s ease}
      .sidebar-backdrop.open{opacity:1;pointer-events:auto}
      .page-header{border-radius:var(--r-md);padding:var(--s3) var(--s4)}
      .content{padding:var(--s3)}
      .pw-sticky{padding:var(--s3) var(--s4);margin:calc(var(--s3)*-1);margin-bottom:0}
      .kpi-grid{grid-template-columns:1fr 1fr}
      .welcome{padding:var(--s5)}
      .welcome-stats{flex-wrap:wrap;gap:var(--s4)}
      .pw-body{grid-template-columns:1fr}
    }

    /* Toast */
    .toast-container{position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.15);animation:toastIn .3s ease;max-width:360px}
    .toast.success{background:#059669}
    .toast.error{background:#dc2626}
    .toast.info{background:#2563eb}
    .toast.leaving{animation:toastOut .25s ease forwards}
    @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    @keyframes toastOut{to{opacity:0;transform:translateX(40px)}}
    .toast-close{margin-left:auto;background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:16px;padding:0;line-height:1}
    .toast-close:hover{color:#fff}

    /* Confirm modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
    .modal-box{background:#fff;border-radius:16px;padding:28px;max-width:360px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:modalIn .2s ease}
    .modal-box h3{font-size:16px;font-weight:700;margin-bottom:8px}
    .modal-box p{font-size:13px;color:var(--text-muted);margin-bottom:20px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end}
    .modal-actions button{height:36px;padding:0 20px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--fast)}
    .modal-cancel{background:var(--bg-alt);color:var(--text);border:1px solid var(--border)!important}
    .modal-cancel:hover{background:var(--border)}
    .modal-confirm{background:#dc2626;color:#fff}
    .modal-confirm:hover{opacity:.9}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
  </style>
</head>
<body>
<div class="toast-container" id="toasts"></div>
<div class="modal-overlay" id="confirmModal" style="display:none" x-data="{ show:false, title:'', message:'', onConfirm:null }" x-show="show" x-transition @click.self="show=false">
  <div class="modal-box">
    <h3 x-text="title"></h3>
    <p x-text="message"></p>
    <div class="modal-actions">
      <button class="modal-cancel" @click="show=false">Cancel</button>
      <button class="modal-confirm" @click="if(onConfirm)onConfirm();show=false">Delete</button>
    </div>
  </div>
</div>
<div class="app" x-data="adminApp()" x-init="init()">
  <aside class="sidebar" :class="{ 'mobile-open': sidebarOpen }">
    <div class="sidebar-brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <span>Ecommerce</span>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-label">Main</div>
      <template x-for="item in navItems" :key="item.id">
        <button class="nav-item" :class="{ active: page === item.id }" @click="switchPage(item.id)">
          <span x-html="item.icon"></span>
          <span x-text="item.label"></span>
          <span class="nav-badge" x-show="item.badge" x-text="item.badge" x-cloak></span>
        </button>
      </template>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item logout" @click="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <div class="sidebar-backdrop" :class="{ open: sidebarOpen }" @click="sidebarOpen=false"></div>

  <div class="main">
    <div class="content">
      <div class="page-header">
        <div>
          <h1 x-text="page==='dashboard'?'Dashboard':page==='orders'?'Orders':page==='products'&&prodDetail?detailForm.name||'Product':page==='products'?'Products':page==='customers'?'Customers':page==='store'?'My Store':page==='packs'?'Packs':''"></h1>
          <p x-text="page==='dashboard'?todayStr:page==='orders'?'Manage and track all customer orders':page==='products'&&prodDetail?'Product workspace — edit and manage':page==='products'?'Browse and manage your product catalog':page==='customers'?'View and manage your customer base':page==='store'?'Manage your store info and branding':page==='packs'?'Create and manage product bundles':''"></p>
        </div>
        <div class="topbar-right" x-data="{ notifOpen: false }">
          <button class="mobile-menu-btn" @click="sidebarOpen=!sidebarOpen" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <button class="notif-btn" @click="notifOpen = !notifOpen; if(notifOpen) loadNotifs()" @click.outside="notifOpen = false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-dot" x-show="unreadCount > 0" x-cloak></span>
          </button>
          <div class="notif-dropdown" :class="{ open: notifOpen }">
            <div class="notif-header"><span>Notifications</span><span style="font-size:11px;font-weight:400;text-transform:none" x-text="unreadCount + ' unread'"></span></div>
            <template x-for="n in notifications" :key="n.id">
              <div class="notif-item" :class="{ unread: !n.is_read }">
                <div class="notif-icon" :style="'background:' + (n.type==='low_stock'?'rgba(245,158,11,.15)':n.type==='cancelled'?'rgba(239,68,68,.15)':'rgba(59,130,246,.15)') + ';color:' + (n.type==='low_stock'?'#d97706':n.type==='cancelled'?'#dc2626':'#2563eb')" x-text="n.type==='low_stock'?'!':n.type==='cancelled'?'x':'i'"></div>
                <div class="notif-body">
                  <div class="notif-title" x-text="n.title"></div>
                  <div class="notif-time" x-text="n.created_at ? new Date(n.created_at).toLocaleDateString() : ''"></div>
                </div>
              </div>
            </template>
            <div x-show="notifications.length === 0" style="padding:var(--s7);text-align:center;color:var(--text-muted);font-size:13px">No notifications yet</div>
          </div>
        </div>
      </div>

      <!-- ===== DASHBOARD ===== -->
      <template x-if="page === 'dashboard'"><div id="page-dashboard">
        <div class="welcome">
          <h2 x-text="'Good ' + timeOfDay + ', Admin'"></h2>
          <p>Here's what's happening with your store today.</p>
            <div class="welcome-stats">
              <div class="welcome-stat"><div class="val" style="color:#10b981" x-text="'DA ' + (kpiData.revenueToday || 0).toLocaleString()"></div><div class="lbl">Revenue <br/>today</div></div>
              <div class="welcome-stat"><div class="val" style="color:#f59e0b" x-text="kpiData.pendingOrders || 0"></div><div class="lbl">Pending <br/>orders</div></div>
              <div class="welcome-stat"><div class="val" style="color:#ef4444" x-text="kpiData.lowStockCount || 0"></div><div class="lbl">Low stock <br/>alerts</div></div>
              <div class="welcome-stat"><div class="val" style="color:#8b5cf6" x-text="kpiData.totalCustomers || 0"></div><div class="lbl">Total <br/>customers</div></div>
            </div>
        </div>

        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-top">
              <div class="kpi-icon" style="background:var(--green-soft);color:#059669"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
              <span class="kpi-trend" :class="kpiData.revChange>=0?'up':'down'" x-text="(kpiData.revChange>=0?'\u2191 ':'\u2193 ')+Math.abs(kpiData.revChange||0).toFixed(1)+'%'"></span>
            </div>
            <div class="kpi-label">Total Revenue</div>
            <div class="kpi-value" x-text="'DA ' + (kpiData.totalRevenue || 0).toLocaleString()"></div>
            <div class="kpi-sub">Lifetime earnings</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top">
              <div class="kpi-icon" style="background:var(--blue-soft);color:#2563eb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
              <span class="kpi-trend" :class="kpiData.ordChange>=0?'up':'down'" x-show="kpiData.totalOrders > 0" x-text="(kpiData.ordChange>=0?'\u2191 ':'\u2193 ')+Math.abs(kpiData.ordChange||0).toFixed(1)+'%'"></span>
            </div>
            <div class="kpi-label">Total Orders</div>
            <div class="kpi-value" x-text="(kpiData.totalOrders || 0).toLocaleString()"></div>
            <div class="kpi-sub" x-text="(kpiData.pendingOrders || 0) + ' pending'"></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top">
              <div class="kpi-icon" style="background:var(--accent-soft);color:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
              <span class="kpi-trend up">&uarr; All time</span>
            </div>
            <div class="kpi-label">Customers</div>
            <div class="kpi-value" x-text="(kpiData.totalCustomers || 0).toLocaleString()"></div>
            <div class="kpi-sub">Total registered</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top">
              <div class="kpi-icon" style="background:var(--orange-soft);color:#d97706"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
              <span class="kpi-trend" :class="(kpiData.lowStockCount || 0) > 5 ? 'down' : 'up'" x-text="(kpiData.lowStockCount || 0) > 5 ? '\u2193 Needs attention' : '\u2191 All good'"></span>
            </div>
            <div class="kpi-label">Active Products</div>
            <div class="kpi-value" x-text="(kpiData.activeProducts || 0).toLocaleString()"></div>
            <div class="kpi-sub" x-text="(kpiData.lowStockCount || 0) + ' low stock'"></div>
          </div>
        </div>

        <div class="row">
          <div class="card">
            <div class="card-header">
              <h3>Revenue Trend</h3>
              <a @click="loadDashboard">Refresh</a>
            </div>
            <div class="card-body">
              <div class="rev-chart-wrap" id="rev-chart"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              <h3>Order Status</h3>
            </div>
            <div class="card-body">
              <div class="status-donut" id="status-dist"></div>
            </div>
          </div>
        </div>

        <div class="kpi-more">
          <div class="kpi-mini"><div class="lbl">Today</div><div class="val" style="color:#10b981" x-text="'DA '+ (kpiData.revenueToday||0).toLocaleString()"></div><div class="sub">Revenue today</div></div>
          <div class="kpi-mini"><div class="lbl">This Week</div><div class="val" style="color:#3b82f6" x-text="'DA '+ (kpiData.revenueWeek||0).toLocaleString()"></div><div class="sub">Weekly revenue</div></div>
          <div class="kpi-mini"><div class="lbl">AOV</div><div class="val" x-text="'DA '+ (kpiData.aov||0).toLocaleString()"></div><div class="sub">Avg order value</div></div>
          <div class="kpi-mini"><div class="lbl">Daily Avg</div><div class="val" x-text="'DA '+ (kpiData.dailyAvg||0).toLocaleString()"></div><div class="sub">30-day daily avg</div></div>
          <div class="kpi-mini"><div class="lbl">Delivered</div><div class="val" style="color:#10b981" x-text="kpiData.deliveredOrders||0"></div><div class="sub" x-text="(kpiData.cancelledOrders||0)+' cancelled'"></div></div>
          <div class="kpi-mini"><div class="lbl">Returned</div><div class="val" style="color:#ef4444" x-text="kpiData.returnedOrders||0"></div><div class="sub">Total returns</div></div>
        </div>

        <div class="row" x-show="alerts.length>0||kpiData.pendingOrders>0||(kpiData.lowStockCount||0)>0" x-cloak>
          <div class="card">
            <div class="card-header"><h3>Today's Insights</h3></div>
            <div class="card-body" style="padding:var(--s3) var(--s5)">
              <template x-if="(kpiData.revenueToday||0)>0">
                <div class="insight-item"><span class="insight-icon" style="background:var(--green-soft);color:#059669">&#10003;</span><span>Revenue today: <strong x-text="'DA '+(kpiData.revenueToday||0).toLocaleString()"></strong></span></div>
              </template>
              <template x-if="(kpiData.pendingOrders||0)>0">
                <div class="insight-item"><span class="insight-icon" style="background:var(--orange-soft);color:#d97706">!</span><span><strong x-text="kpiData.pendingOrders"></strong> pending order<template x-if="kpiData.pendingOrders>1">s</template> need attention</span></div>
              </template>
              <template x-if="(kpiData.lowStockCount||0)>0">
                <div class="insight-item"><span class="insight-icon" style="background:var(--red-soft);color:#dc2626">&#9888;</span><span><strong x-text="kpiData.lowStockCount"></strong> product<template x-if="kpiData.lowStockCount>1">s</template> need restocking</span></div>
              </template>
              <template x-if="(kpiData.deliveredOrders||0)>0">
                <div class="insight-item"><span class="insight-icon" style="background:var(--green-soft);color:#059669">&#10003;</span><span><strong x-text="kpiData.deliveredOrders"></strong> order<template x-if="kpiData.deliveredOrders>1">s</template> delivered</span></div>
              </template>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Quick Actions</h3></div>
            <div class="card-body">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)">
                <button style="display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s4);border:1px solid var(--border);border-radius:var(--r-md);background:none;cursor:pointer;transition:all var(--fast);font-family:inherit" @click="page='orders'">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                  <span style="font-size:12px;font-weight:600">View Orders</span>
                </button>
                <button style="display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s4);border:1px solid var(--border);border-radius:var(--r-md);background:none;cursor:pointer;transition:all var(--fast);font-family:inherit" @click="page='products'">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#059669"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                  <span style="font-size:12px;font-weight:600">Manage Products</span>
                </button>
                <button style="display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s4);border:1px solid var(--border);border-radius:var(--r-md);background:none;cursor:pointer;transition:all var(--fast);font-family:inherit" @click="loadDashboard">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#2563eb"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <span style="font-size:12px;font-weight:600">Refresh Data</span>
                </button>
                <button style="display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s4);border:1px solid var(--border);border-radius:var(--r-md);background:none;cursor:pointer;transition:all var(--fast);font-family:inherit" @click="page='customers'">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#d97706"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                  <span style="font-size:12px;font-weight:600">View Customers</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="card">
            <div class="card-header"><h3>Best Sellers by Quantity</h3></div>
            <div class="card-body" id="bs-byQuantity"></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Best Sellers by Revenue</h3></div>
            <div class="card-body" id="bs-byRevenue"></div>
          </div>
        </div>

        <div class="row">
          <div class="card">
            <div class="card-header"><h3>Sales by Category</h3></div>
            <div class="card-body" id="cat-chart"></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Top Customers</h3></div>
            <div class="card-body" style="padding:var(--s3) var(--s5)">
              <template x-for="(c,i) in topCustomers.slice(0,7)" :key="c.id">
                <div class="cust-row">
                  <div class="cust-rank" x-text="i+1"></div>
                  <div class="cust-avatar" x-text="(c.first_name||'?')[0]+(c.last_name||'?')[0]"></div>
                  <div class="cust-info">
                    <div class="cust-name" x-text="c.first_name+' '+c.last_name"></div>
                    <div class="cust-phone" x-text="c.phone||'No phone'"></div>
                  </div>
                  <div>
                    <div class="cust-val" x-text="'DA '+ (c.lifetime||0).toLocaleString()"></div>
                    <div class="cust-sub" x-text="(c.orders||0)+' orders'"></div>
                  </div>
                </div>
              </template>
              <div x-show="topCustomers.length===0" style="padding:var(--s5);text-align:center;color:var(--text-muted);font-size:13px">No customer data yet</div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="card">
            <div class="card-header" @click="unsoldOpen=!unsoldOpen" style="cursor:pointer">
              <h3>Unsold Products <span style="font-size:11px;font-weight:400;color:var(--text-muted)" x-text="'('+unsold.neverSold.length+' never sold'+(unsold.stale.length?', '+unsold.stale.length+' stale':'')+')'"></span></h3>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" :class="{ open: unsoldOpen }" style="transition:transform .25s;color:var(--text-muted)"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="accordion-body" x-show="unsoldOpen" x-cloak>
              <div x-show="unsold.neverSold.length===0&&unsold.stale.length===0" style="padding:var(--s3);text-align:center;color:var(--text-muted);font-size:13px">All products have been sold</div>
              <template x-if="unsold.neverSold.length>0">
                <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:var(--s2);margin-top:var(--s2)">Never Sold</div>
                <div style="max-height:160px;overflow-y:auto">
                  <table style="font-size:12px"><thead><tr><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th></tr></thead>
                    <tbody><template x-for="p in unsold.neverSold" :key="p.id">
                      <tr><td x-text="p.name"></td><td style="color:var(--text-muted)" x-text="p.sku||'-'"></td><td x-text="'DA '+p.price.toLocaleString()"></td><td x-text="p.stock"></td></tr>
                    </template></tbody>
                  </table>
                </div></div>
              </template>
              <template x-if="unsold.stale.length>0">
                <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:var(--s2);margin-top:var(--s3)">Not Sold in 30 Days</div>
                <div style="max-height:160px;overflow-y:auto">
                  <table style="font-size:12px"><thead><tr><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th></tr></thead>
                    <tbody><template x-for="p in unsold.stale" :key="p.id">
                      <tr><td x-text="p.name"></td><td style="color:var(--text-muted)" x-text="p.sku||'-'"></td><td x-text="'DA '+p.price.toLocaleString()"></td><td x-text="p.stock"></td></tr>
                    </template></tbody>
                  </table>
                </div></div>
              </template>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3>COD Reliability</h3></div>
            <div class="card-body" style="padding:var(--s3) var(--s5)">
              <template x-for="c in codReliability.slice(0,7)" :key="c.id">
                <div class="cust-row">
                  <div class="cust-avatar" style="background:var(--red-soft);color:#dc2626" x-text="(c.first_name||'?')[0]+(c.last_name||'?')[0]"></div>
                  <div class="cust-info">
                    <div class="cust-name" x-text="c.first_name+' '+c.last_name"></div>
                    <div class="cust-phone" x-text="c.phone||''"></div>
                  </div>
                  <div>
                    <div class="cust-val" style="color:#ef4444" x-text="c.failed+'/'+c.total"></div>
                    <div class="cust-sub" x-text="c.rate.toFixed(0)+'% failure'"></div>
                  </div>
                  <span class="cust-risk" :style="'background:'+(c.rate>50?'#ef4444':c.rate>25?'#f59e0b':'#10b981')" :title="c.rate.toFixed(0)+'% fail rate'"></span>
                </div>
              </template>
              <div x-show="codReliability.length===0" style="padding:var(--s5);text-align:center;color:var(--text-muted);font-size:13px">No delivery issues recorded</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>Recent Orders</h3><a @click="page='orders'">View All</a></div>
          <div class="table-wrap">
            <table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="recent-orders-body"></tbody></table>
          </div>
        </div>
      </div></template>

      <!-- ===== ORDERS ===== -->
      <template x-if="page === 'orders'"><div id="page-orders">
        
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)">
          <div class="filters">
            <div class="filter-control" style="cursor:text">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" placeholder="Search orders..." x-model="orderSearch" @input.debounce.500ms="loadOrders()"/>
            </div>
            <div style="position:relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
              <button class="filter-control" @click="open = !open" type="button">
                <span class="status-dot" :style="'background:' + (orderStatus ? statusColors[orderStatus] : '#8a8a8e')"></span>
                <span style="font-size:13px;font-weight:500" x-text="orderStatus ? orderStatus.charAt(0).toUpperCase() + orderStatus.slice(1) : 'All status'"></span>
                <span class="arrow" :class="{ open }">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </span>
              </button>
              <div class="dropdown-menu" :class="{ open }">
                <button class="dropdown-option" :class="{ active: !orderStatus }" @click="orderStatus = ''; open = false; loadOrders()" type="button">
                  <span class="opt-dot" style="background:#8a8a8e"></span>
                  <span class="opt-label">All status</span>
                  <span class="opt-check">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                  </span>
                </button>
                <div class="dropdown-divider"></div>
                <template x-for="s in statusList" :key="s.val">
                  <button class="dropdown-option" :class="{ active: orderStatus === s.val }" @click="orderStatus = s.val; open = false; loadOrders()" type="button">
                    <span class="opt-dot" :style="'background:' + s.color"></span>
                    <span class="opt-label" x-text="s.label"></span>
                    <span class="opt-check">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                </template>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="orders-body"></tbody></table>
          </div>
          <div class="pagination" id="orders-pages"></div>
        </div>
      </div></template>

      <!-- ===== PRODUCTS ===== -->
      <template x-if="page === 'products' && !prodDetail"><div id="page-products">
        
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4);flex-wrap:wrap;gap:var(--s3)">
          <div class="filter-control" style="cursor:text;flex:1;min-width:200px">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" placeholder="Search products..." x-model="prodSearch" @input.debounce.500ms="loadProducts()"/>
          </div>
          <div style="display:flex;gap:var(--s2);flex-wrap:wrap">
            <div class="field-dropdown" style="min-width:140px" :class="{ open: prodStatusOpen }" @click.outside="prodStatusOpen=false">
              <button class="trigger" @click="prodStatusOpen=!prodStatusOpen" type="button">
                <span class="val" :class="{ placeholder: !prodStatusFilter }" x-text="prodStatusFilter==='active'?'Active':prodStatusFilter==='draft'?'Draft':'All Status'"></span>
                <span class="arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></span>
              </button>
              <div class="menu">
                <button class="opt" :class="{ selected: !prodStatusFilter }" @click="prodStatusFilter='';prodStatusOpen=false;loadProducts()" type="button">
                  <span class="opt-label">All Status</span>
                  <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>
                </button>
                <button class="opt" :class="{ selected: prodStatusFilter==='active' }" @click="prodStatusFilter='active';prodStatusOpen=false;loadProducts()" type="button">
                  <span class="opt-label">Active</span>
                  <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>
                </button>
                <button class="opt" :class="{ selected: prodStatusFilter==='draft' }" @click="prodStatusFilter='draft';prodStatusOpen=false;loadProducts()" type="button">
                  <span class="opt-label">Draft</span>
                  <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>
                </button>
              </div>
            </div>
            <div class="field-dropdown" style="min-width:160px" :class="{ open: prodSortOpen }" @click.outside="prodSortOpen=false">
              <button class="trigger" @click="prodSortOpen=!prodSortOpen" type="button">
                <span class="val" :class="{ placeholder: !prodSortBy || prodSortBy==='newest' }" x-text="({newest:'Newest',oldest:'Oldest',price_asc:'Price: Low→High',price_desc:'Price: High→Low',name_asc:'Name: A→Z',name_desc:'Name: Z→A',stock_asc:'Stock: Low',stock_desc:'Stock: High'})[prodSortBy]||'Sort'"></span>
                <span class="arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></span>
              </button>
              <div class="menu">
                <template x-for="opt in [{val:'newest',label:'Newest'},{val:'oldest',label:'Oldest'},{val:'price_asc',label:'Price: Low → High'},{val:'price_desc',label:'Price: High → Low'},{val:'name_asc',label:'Name: A → Z'},{val:'name_desc',label:'Name: Z → A'},{val:'stock_asc',label:'Stock: Low'},{val:'stock_desc',label:'Stock: High'}]" :key="opt.val">
                  <button class="opt" :class="{ selected: prodSortBy===opt.val }" @click="prodSortBy=opt.val;prodSortOpen=false;loadProducts()" type="button">
                    <span class="opt-label" x-text="opt.label"></span>
                    <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>
                  </button>
                </template>
              </div>
            </div>
            <button class="btn-primary" style="width:auto;height:36px;padding:0 var(--s5);font-size:13px;text-transform:none;letter-spacing:0" @click="openProductForm()">+ New Product</button>
          </div>
        </div>
        <div x-show="!prodLoading" class="prod-grid" id="products-grid"></div>
        <div x-show="prodLoading" style="text-align:center;padding:var(--s8);color:var(--text-muted);font-size:14px">Loading...</div>
        <div class="pagination" id="products-pages"></div>
      </div></template>

      <!-- ===== PRODUCT DETAIL ===== -->
      <template x-if="page === 'products' && prodDetail"><div id="page-product-detail">
        <div class="pw-sticky">
          <div class="pw-sticky-left">
            <button class="pw-back" @click="prodDetail=null;loadProducts()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
              Back
            </button>
            <div style="width:1px;height:20px;background:var(--border)"></div>
            <button class="pw-badge pw-toggle-btn" :class="detailForm.isActive?'pw-badge-published':'pw-badge-draft'" @click="toggleStatus()" title="Click to toggle status" type="button">
              <span class="pw-badge-dot"></span>
              <span x-text="detailForm.isActive?'Published':'Draft'"></span>
            </button>
            <span class="pw-id" x-text="'#'+detailForm.id"></span>
          </div>
          <div class="pw-sticky-right">
            <button class="btn-secondary" style="height:34px;padding:0 var(--s4);font-size:12px;color:var(--red);border-color:var(--red)" @click="deleteProductDetail()">Delete</button>
            <button class="btn-secondary" style="height:34px;padding:0 var(--s4);font-size:12px;opacity:0.5;pointer-events:none" :style="hasUnsaved?'opacity:1;pointer-events:auto':''" @click="revertProductDetail()">Discard</button>
            <button class="btn-primary" style="height:34px;padding:0 var(--s5);font-size:12px" :class="{ loading: saving }" :disabled="!hasUnsaved" @click="saveProductDetail()">
              <span class="spinner"></span>
              <span class="btn-text" x-text="saving?'Saving...':'Save Changes'"></span>
            </button>
            <span x-show="savedMsg" style="font-size:12px;color:#059669;font-weight:600" x-text="savedMsg"></span>
          </div>
        </div>

        <div class="pw-body">
          <!-- MAIN COLUMN -->
          <div class="pw-main">
            <!-- General Information -->
            <div class="pw-card">
              <div class="pw-card-head"><h3>General Information</h3><span class="pw-card-hint">Click any field to edit</span></div>
              <div class="pw-card-body">
                <div class="pw-fld">
                  <label>Product Name</label>
                  <input class="pw-inp" type="text" x-model="detailForm.name" placeholder="e.g. Gold Standard Whey"/>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)">
                  <div class="pw-fld">
                    <label>Brand</label>
                    <input class="pw-inp" type="text" x-model="detailForm.brandName" placeholder="Brand name"/>
                  </div>
                  <div class="pw-fld">
                    <label>SKU</label>
                    <input class="pw-inp" type="text" x-model="detailForm.sku" placeholder="e.g. ON-WHEY-5LB"/>
                  </div>
                </div>
                <div class="pw-fld">
                  <label>Description</label>
                  <textarea class="pw-inp pw-textarea" x-model="detailForm.description" placeholder="Product description..."></textarea>
                </div>
              </div>
            </div>

            <!-- Description Sections -->
            <div class="pw-card">
              <div class="pw-card-head"><h3>Content Sections</h3></div>
