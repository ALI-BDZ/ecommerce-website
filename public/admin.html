              <div class="pw-card-body" style="padding:var(--s3) var(--s5)">
                <div class="pw-section-row">
                  <div>
                    <span class="lbl">Ingredients</span>
                    <span class="desc">Nutritional ingredients list</span>
                  </div>
                  <span class="pw-section-status" :class="detailForm.showIngredients?'on':'off'" x-text="detailForm.showIngredients?'ON':'OFF'"></span>
                  <button class="toggle" :class="{ active: detailForm.showIngredients }" @click="detailForm.showIngredients=!detailForm.showIngredients" type="button"></button>
                </div>
                <div class="pw-section-row">
                  <div>
                    <span class="lbl">How To Use</span>
                    <span class="desc">Usage instructions</span>
                  </div>
                  <span class="pw-section-status" :class="detailForm.showHowToUse?'on':'off'" x-text="detailForm.showHowToUse?'ON':'OFF'"></span>
                  <button class="toggle" :class="{ active: detailForm.showHowToUse }" @click="detailForm.showHowToUse=!detailForm.showHowToUse" type="button"></button>
                </div>
              </div>
            </div>

            <!-- Ingredients (conditional) -->
            <div class="pw-card" x-show="detailForm.showIngredients" x-cloak>
              <div class="pw-card-head"><h3>Ingredients</h3><span class="pw-card-hint">One per line</span></div>
              <div class="pw-card-body">
                <div class="pw-fld">
                  <textarea class="pw-inp pw-textarea" x-model="detailForm.ingredients" placeholder="Whey Protein Isolate&#10;Creatine Monohydrate&#10;BCAAs"></textarea>
                </div>
              </div>
            </div>

            <!-- How To Use (conditional) -->
            <div class="pw-card" x-show="detailForm.showHowToUse" x-cloak>
              <div class="pw-card-head"><h3>How To Use</h3><span class="pw-card-hint">One step per line</span></div>
              <div class="pw-card-body">
                <div class="pw-fld">
                  <textarea class="pw-inp pw-textarea" x-model="detailForm.howToUse" placeholder="Mix 1 scoop with 300ml water&#10;Shake well&#10;Consume post-workout"></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- SIDEBAR -->
          <div class="pw-sidebar">
            <!-- Image -->
            <div class="pw-card">
              <div class="pw-card-head"><h3>Product Image</h3></div>
              <div class="pw-card-body">
                <div class="pw-img-main" @click="$refs.detailImgInput.click()">
                  <template x-if="!imgUploading">
                    <img :src="detailImg || 'https://placehold.co/600x600/f5f5f6/0d0d0d?text=Product'" :alt="detailForm.name" @error="$event.target.src='https://placehold.co/600x600/f5f5f6/0d0d0d?text=No+Image'"/>
                  </template>
                  <template x-if="imgUploading">
                    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:13px;flex-direction:column;gap:var(--s2)">
                      <div class="spinner" style="width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite"></div>
                      <span>Uploading...</span>
                    </div>
                  </template>
                  <div class="pw-img-overlay">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span>Replace Image</span>
                  </div>
                  <input type="file" accept="image/jpeg,image/png,image/webp" x-ref="detailImgInput" @change="changeDetailImage($event)" class="pw-detail-input"/>
                </div>
                <div class="pw-gallery" style="margin-top:var(--s3)" x-show="detailImg">
                  <div class="pw-thumb"><img :src="detailImg" alt="" @error="$event.target.parentElement.style.display='none'"/></div>
                </div>
              </div>
            </div>

            <!-- Pricing -->
            <div class="pw-card">
              <div class="pw-card-head"><h3>Pricing</h3></div>
              <div class="pw-card-body">
                <div class="pw-fld">
                  <label>Selling Price (DZD)</label>
                  <input class="pw-inp" type="number" x-model="detailForm.price" placeholder="9900"/>
                </div>
                <div class="pw-fld">
                  <label>Cost Price (DZD)</label>
                  <input class="pw-inp" type="number" x-model="detailForm.costPrice" placeholder="6000"/>
                </div>
                <div class="pw-fld">
                  <label>Compare-at Price (DZD)</label>
                  <input class="pw-inp" type="number" x-model="detailForm.comparePrice" placeholder="12000"/>
                </div>
                <div class="pw-fld" x-show="detailForm.comparePrice > 0">
                  <div class="pw-margin" x-text="'DA '+((detailForm.comparePrice||0)-(detailForm.price||0)).toLocaleString()+' savings'"></div>
                </div>
                <div class="pw-fld" x-show="detailForm.costPrice > 0 && detailForm.price > 0">
                  <div class="pw-margin" x-text="'Margin: '+Math.round(((detailForm.price-detailForm.costPrice)/detailForm.price)*100)+'%'" style="color:var(--green)"></div>
                </div>
              </div>
            </div>

            <!-- Inventory -->
            <div class="pw-card">
              <div class="pw-card-head"><h3>Inventory</h3></div>
              <div class="pw-card-body">
                <div class="pw-stock-row">
                  <div class="pw-stock-num" :style="'color:'+(detailForm.stock===0?'var(--red)':detailForm.stock<=5?'var(--orange)':'var(--green)')" x-text="detailForm.stock"></div>
                  <div><div class="pw-stock-label">Units in stock</div></div>
                </div>
                <div class="pw-stock-bar" style="margin-top:var(--s2)">
                  <div class="pw-stock-fill" :style="'width:'+Math.min(100,(detailForm.stock/50)*100)+'%;background:'+(detailForm.stock===0?'var(--red)':detailForm.stock<=5?'var(--orange)':'var(--green)')"></div>
                </div>
                <div class="pw-fld" style="margin-top:var(--s4)">
                  <label>Stock Quantity</label>
                  <input class="pw-inp" type="number" x-model="detailForm.stock" placeholder="50"/>
                </div>
                <div class="pw-fld">
                  <label>Low Stock Alert</label>
                  <input class="pw-inp" type="number" x-model="detailForm.lowStock" placeholder="5"/>
                </div>
                <div class="pw-fld">
                  <label>Weight (kg)</label>
                  <input class="pw-inp" type="number" step="0.01" x-model="detailForm.weight" placeholder="2.27"/>
                </div>
              </div>
            </div>

            <!-- Visibility -->
            <div class="pw-card">
              <div class="pw-card-head"><h3>Visibility</h3></div>
              <div class="pw-card-body" style="padding:var(--s3) var(--s5)">
                <div class="pw-section-row">
                  <div>
                    <span class="lbl">Status</span>
                    <span class="desc">Published or draft</span>
                  </div>
                  <span class="pw-section-status" :class="detailForm.isActive?'on':'off'" x-text="detailForm.isActive?'ON':'OFF'" @click="toggleStatus()" style="cursor:pointer"></span>
                  <button class="toggle" :class="{ active: detailForm.isActive }" @click="toggleStatus()" type="button"></button>
                </div>
                <div class="pw-section-row">
                  <div>
                    <span class="lbl">Featured</span>
                    <span class="desc">Show on homepage</span>
                  </div>
                  <button class="toggle" :class="{ active: detailForm.isFeatured }" @click="toggleFeatured()" type="button"></button>
                </div>
              </div>
            </div>

            <!-- Product Health -->
            <div class="pw-card">
              <div class="pw-card-head"><h3>Product Health</h3></div>
              <div class="pw-card-body">
                <div class="pw-health">
                  <div class="pw-health-row">
                    <span class="icon" :class="detailImg?'ok':'miss'" x-text="detailImg?'&#10003;':'&#10007;'"></span>
                    <span class="label">Image</span>
                  </div>
                  <div class="pw-health-row">
                    <span class="icon" :class="detailForm.description?'ok':'miss'" x-text="detailForm.description?'&#10003;':'&#10007;'"></span>

                <div class="pack-card-desc" x-text="p.description"></div>

                  <span class="pack-card-price" x-text="Number(p.price).toLocaleString() + ' DZD'"></span>

              </div>
              <div class="pack-card-actions">
                <button class="btn-icon" title="Edit" @click="editPack(p)" style="width:30px;height:30px;font-size:13px">&#9998;</button>

          </template>
        </div>
      </div></template>

      <!-- ===== CUSTOMERS ===== -->
      <template x-if="page === 'customers'"><div id="page-customers">
        
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)">

            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

        </div>
        <div class="card">
          <div class="table-wrap">
            <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>LTV</th><th>Risk</th><th>Last Order</th></tr></thead><tbody id="customers-body"></tbody></table>

          <div class="pagination" id="customers-pages"></div>
        </div>
      </div></template>
    </div>
  </div>

  <!-- Product Form Slideover -->
  <div class="slideover" :class="{ open: showProductForm }">
    <div class="backdrop" @click="closeProductForm()"></div>

      <div class="panel-header">
        <h2 x-text="editingProduct ? 'Edit Product' : 'New Product'"></h2>
        <button class="panel-close" @click="closeProductForm()">&times;</button>
      </div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="form-block full"><label>Product Name</label><input class="field" x-model="form.name" placeholder="e.g. Gold Standard Whey"/></div>

          <div class="form-block"><label>Price (DZD)</label><input class="field" type="number" x-model="form.price" placeholder="9900"/></div>

            <template x-if="!showNewBrand">
              <div class="field-dropdown" :class="{ open: brandOpen }" @click.outside="brandOpen=false">
                <div class="trigger" @click="brandOpen=!brandOpen;if(brandOpen)setTimeout(()=>$el.nextElementSibling?.querySelector('.search input')?.focus(),50)" role="button" tabindex="0" @keydown.enter="brandOpen=!brandOpen">
                  <span class="val" :class="{ placeholder: !form.brandId }" x-text="form.brandId ? (brands.find(b=>b.id===form.brandId)?.name||'Select brand') : 'Select brand'"></span>
                  <span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></span>
                </div>
                <div class="menu">
                  <div class="search"><input type="text" placeholder="Search brands..." x-model="brandSearch" @keydown.escape="brandOpen=false"/></div>

                      <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>
                    </button>
                  </template>
                  <div x-show="brands.filter(x=>!brandSearch||x.name.toLowerCase().includes(brandSearch.toLowerCase())).length===0" class="opt-empty">No brands found</div>
                  <div class="divider"></div>
                  <button class="opt-add" @click="showNewBrand=true;brandOpen=false;brandSearch='';setTimeout(()=>$el?.focus(),100)" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add new brand
                  </button>
                </div>
              </div>
            </template>
            <template x-if="showNewBrand">
              <div style="display:flex;gap:var(--s2);align-items:center">

                <button style="height:36px;padding:0 var(--s3);border-radius:var(--r-md);border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:var(--s1);white-space:nowrap" @click="createBrand()" x-text="addingBrand?'Creating...':'Save'"></button>
                <button style="height:36px;width:36px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-card);color:var(--text-muted);font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center" @click="showNewBrand=false;newBrandName=''">&times;</button>
              </div>
            </template>
          </div>
          <div class="form-block"><label>Category</label>
            <template x-if="!showNewCat">

                  <span class="val" :class="{ placeholder: !form.categoryId }" x-text="form.categoryId ? (categories.find(c=>c.id===form.categoryId)?.name||'Select category') : 'Select category'"></span>

                </div>
                <div class="menu">
                  <div class="search"><input type="text" placeholder="Search categories..." x-model="catSearch" @keydown.escape="catOpen=false"/></div>
                  <template x-for="c in categories.filter(x=>!catSearch||x.name.toLowerCase().includes(catSearch.toLowerCase()))" :key="c.id">
                    <button class="opt" :class="{ selected: form.categoryId===c.id }" @click="form.categoryId=c.id;catOpen=false;catSearch=''" type="button">
                      <span class="opt-label" x-text="c.name"></span>
                      <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>
                    </button>
                  </template>
                  <div x-show="categories.filter(x=>!catSearch||x.name.toLowerCase().includes(catSearch.toLowerCase())).length===0" class="opt-empty">No categories found</div>
                  <div class="divider"></div>
                  <button class="opt-add" @click="showNewCat=true;catOpen=false;catSearch='';setTimeout(()=>$el?.focus(),100)" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add new category
                  </button>
                </div>
              </div>
            </template>
            <template x-if="showNewCat">
              <div style="display:flex;gap:var(--s2);align-items:center">

                <button style="height:36px;width:36px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-card);color:var(--text-muted);font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center" @click="showNewCat=false;newCatName=''">&times;</button>
              </div>
            </template>
          </div>
        </div>

        <div class="form-block full" style="margin-top:var(--s4)"><label>Ingredients</label><textarea class="field" x-model="form.ingredients" placeholder="One per line" rows="3"></textarea></div>

        <div class="form-block full" style="margin-top:var(--s5)"><label>Images</label></div>
        <div class="upload-zone" x-ref="dropzone" @click="$refs.fileInput.click()" @dragover.prevent="dragover=true" @dragleave="dragover=false" @drop.prevent="handleDrop($event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p>Drop images here or click to upload</p>
          <div class="upload-progress" :style="{ display: uploading ? 'block' : 'none' }"><div class="bar" :style="{ width: uploadProgress + '%' }"></div></div>

        <input type="file" accept="image/jpeg,image/png,image/webp" multiple x-ref="fileInput" @change="handleFiles($event.target.files)" style="display:none"/>

      <div class="panel-footer">
        <button class="btn-secondary" @click="closeProductForm()">Cancel</button>
        <button class="btn-primary" style="width:auto;height:38px;padding:0 var(--s6);font-size:13px;text-transform:none;letter-spacing:0" :class="{ loading: saving }" @click="saveProduct()">
          <span class="spinner"></span>
          <span class="btn-text" x-text="editingProduct ? 'Save Changes' : 'Create Product'"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  function adminApp(){
    return{
      page:location.hash.slice(1)||'dashboard',greeting:'',todayStr:'',timeOfDay:'',sidebarOpen:false,
      kpiData:{},alerts:[],notifications:[],unreadCount:0,
      bestSellers:{byQuantity:[],byRevenue:[]},unsold:{neverSold:[],stale:[]},unsoldOpen:false,
      topCustomers:[],codReliability:[],categoryBreakdown:[],recentOrders:[],
      orderSearch:'',orderStatus:'',orderPage:1,orderTotal:0,
      statusColors:{pending:'#f59e0b',confirmed:'#3b82f6',processing:'#3b82f6',shipped:'#7c3aed',delivered:'#10b981',cancelled:'#ef4444'},
      statusList:[
        {val:'pending',label:'Pending',color:'#f59e0b'},
        {val:'confirmed',label:'Confirmed',color:'#3b82f6'},
        {val:'processing',label:'Processing',color:'#3b82f6'},
        {val:'shipped',label:'Shipped',color:'#7c3aed'},
        {val:'delivered',label:'Delivered',color:'#10b981'},

      init(){
        window._adminApp=this
        const token=localStorage.getItem('admin_token')
        if(!token){location.href='/admin-login.html';return}
        this._token=token
        const hashPage=location.hash.slice(1)
        if(hashPage&&['dashboard','orders','products','customers','store','packs'].includes(hashPage)){this.page=hashPage;setTimeout(()=>this.switchPage(hashPage),0)}else{this.loadDashboard()}
        const h=new Date().getHours()
        this.timeOfDay=h<12?'morning':h<17?'afternoon':'evening'
        this.greeting='Good '+this.timeOfDay+', Admin'
        this.todayStr=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})
        let sx=0
        document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true})
        document.addEventListener('touchmove',e=>{
          if(window.innerWidth>768)return
          const dx=e.touches[0].clientX-sx
          if(!this.sidebarOpen&&sx<30&&dx>80){this.sidebarOpen=true;sx=0}
          else if(this.sidebarOpen&&dx<-80){this.sidebarOpen=false;sx=0}
        },{passive:true})
        this.$watch('detailForm',()=>{
          if(this._toggling)return
          if(this.detailSnapshot){
            this.hasUnsaved=JSON.stringify(this.detailForm)!==JSON.stringify(this.detailSnapshot)
          }
        },{deep:true})
      },
      authFetch(url,opts={}){
        const headers=opts.headers||{}
        headers['Authorization']='Bearer '+this._token
        if(opts.body&&typeof opts.body==='string'&&!headers['Content-Type']){headers['Content-Type']='application/json'}
        return fetch(url,{...opts,headers}).then(r=>{
          if(r.status===401){localStorage.removeItem('admin_token');location.href='/admin-login.html';return Promise.reject('Unauthorized')}
          return r
        })
      },
      // Toast helper
      toast(msg,type='success'){
        const el=document.createElement('div')
        el.className='toast '+type
        el.innerHTML='<span>'+msg+'</span><button class="toast-close" onclick="this.parentElement.remove()">&times;</button>'
        document.getElementById('toasts').appendChild(el)
        setTimeout(()=>{el.classList.add('leaving');setTimeout(()=>el.remove(),250)},3000)
      },
      // Confirm helper (returns promise)
      confirm(title,message){
        return new Promise(resolve=>{
          const modal=document.getElementById('confirmModal')
          const data=Alpine.$data(modal)
          data.title=title;data.message=message;data.onConfirm=()=>resolve(true);data.show=true
          modal.addEventListener('click',function handler(e){if(e.target===modal||e.target.classList.contains('modal-cancel')){data.show=false;resolve(false);modal.removeEventListener('click',handler)}})
        })
      },
      switchPage(id){

      renderRevChart(data){
        const el=document.getElementById('rev-chart')
        if(!el)return
        const days=30
        const now=new Date()
        const map={}
        data.forEach(d=>{map[d.date]=d.val})
        const points=[]
        for(let i=days-1;i>=0;i--){
          const dt=new Date(now);dt.setDate(dt.getDate()-i)
          const key=dt.toISOString().slice(0,10)
          points.push({date:key,val:map[key]||0,label:dt.toLocaleDateString('en',{weekday:'short'}).slice(0,3)+' '+dt.getDate()})
        }
        const max=Math.max(...points.map(p=>p.val),1)
        const yTicks=5
        const yLabels=[]
        for(let i=0;i<=yTicks;i++){yLabels.push(Math.round(max*(yTicks-i)/yTicks))}
        const gridHtml=Array(yTicks+1).fill(0).map(()=>'<div class="gl"></div>').join('')
        const yHtml=yLabels.map(v=>'DA '+v.toLocaleString()).map(l=>'<span>'+l+'</span>').join('')
        const barHtml=points.map(p=>{
          const h=p.val>0?Math.max((p.val/max)*160,4):2
          const cls=p.val>0?'has-value':'zero'
          const shortLabel=p.label.slice(4)
          return '<div class="bar-wrap"><div class="bar '+cls+'" style="height:'+h+'px"><div class="chart-tooltip">DA '+p.val.toLocaleString()+'</div></div><span class="bar-label">'+shortLabel+'</span></div>'
        }).join('')
        el.innerHTML='<div class="rev-yaxis">'+yHtml+'</div><div class="rev-bars-wrap"><div class="rev-gridlines">'+gridHtml+'</div>'+barHtml+'</div>'
      },
      renderStatusDist(ordData,kpi){

          {label:'Pending',val:kpi?.pendingOrders||0,color:'#f59e0b'},

          {label:'Delivered',val:kpi?.deliveredOrders||0,color:'#10b981'},

        }).join('')
      },
      renderBestSellers(){

            const name=d.name||d.product_name||'Unknown Product'

          }).join('')
        })
      },
      renderCategoryChart(){

      renderRecentOrders(){

      loadProducts(){

      openProductForm(){

        this.form={name:'',description:'',price:0,costPrice:0,comparePrice:0,sku:'',barcode:'',stock:0,lowStock:5,weight:0,brandId:'',categoryId:'',ingredients:'',howToUse:'',showIngredients:true,showHowToUse:true,isFeatured:false,images:[],isActive:true}

      closeProductForm(){

      },

      async editProduct(id){
        try{
          const r=await this.authFetch('/api/admin/products/detail/'+id)
          const d=await r.json()
          this.form={
            name:d.Name||'',description:d.Description||'',
            price:d.Price||0,costPrice:d.CostPrice||0,comparePrice:d.CompareAtPrice||0,sku:d.SKU||'',barcode:d.Barcode||'',
            stock:d.Stock||0,lowStock:d.LowStockThreshold||5,weight:d.WeightGrams?d.WeightGrams/1000:'',
            brandId:d.BrandID||'',categoryId:d.CategoryID||'',
            ingredients:d.Ingredients||'',howToUse:d.HowToUse||'',
            showIngredients:d.Sections?.includes('ingredients')||false,
            showHowToUse:d.Sections?.includes('how_to_use')||false,
            isFeatured:d.IsFeatured||false,
            images:(d.Images||[]).map(i=>i.url),isActive:d.IsActive
          }
          this.editingProduct=id
          this.showProductForm=true
          this.loadBrands();this.loadCategories()
        }catch(e){console.error(e)}
      },

      async saveProduct(){
        if(!this.form.name.trim())return
        this.saving=true
        const sections=[]
        if(this.form.showIngredients) sections.push('ingredients')
        if(this.form.showHowToUse) sections.push('how_to_use')

        const payload={
          name:this.form.name,description:this.form.description,ingredients:this.form.ingredients,
          how_to_use:this.form.howToUse,sku:this.form.sku,barcode:this.form.barcode,
          brand_id:this.form.brandId,category_id:this.form.categoryId,
          price:Number(this.form.price)||0,cost_price:Number(this.form.costPrice)||0,
          compare_at_price:Number(this.form.comparePrice)||0,
          stock:Number(this.form.stock)||0,
          low_stock_threshold:Number(this.form.lowStock)||5,
          weight_grams:Number(this.form.weight)*1000||0,
          is_active:this.form.isActive,is_featured:this.form.isFeatured,
          sections:sections.join(','),image_urls:this.form.images
        }

        try{
          const url=this.editingProduct?'/api/admin/products/'+this.editingProduct:'/api/admin/products'
          const method=this.editingProduct?'PUT':'POST'
          const r=await this.authFetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
          const d=await r.json()
          if(d.success||d.id){
            this.closeProductForm()
            this.loadProducts()
          }else{alert(d.error||'Error saving product')}
        }catch(e){alert('Save failed')}
        finally{this.saving=false}
      },

      async viewProduct(id){
        try{
          const r=await this.authFetch('/api/admin/products/detail/'+id)
          const d=await r.json()
          this.detailForm={
            id:d.ID,name:d.Name||'',description:d.Description||'',ingredients:d.Ingredients||'',howToUse:d.HowToUse||'',
            price:d.Price||0,costPrice:d.CostPrice||0,stock:d.Stock||0,sku:d.SKU||'',brandName:d.Brand||d.BrandID||'',categoryId:d.CategoryID||'',
            showIngredients:d.Sections?.includes('ingredients')||false,showHowToUse:d.Sections?.includes('how_to_use')||false,
            comparePrice:d.CompareAtPrice||0,lowStock:d.LowStockThreshold||5,weight:d.WeightGrams?d.WeightGrams/1000:'',
            isActive:d.IsActive!==false,isFeatured:d.IsFeatured||false
          }
          this.detailEdit={}
          this.detailImg=(Array.isArray(d.Images)&&d.Images.length>0&&d.Images[0]?.url)?d.Images[0].url:''
          this.detailSnapshot=JSON.parse(JSON.stringify(this.detailForm))
          this.hasUnsaved=false
          this.savedMsg=''
          this.prodDetail=id
        }catch(e){console.error(e)}
      },
      async saveProductDetail(){
        this.saving=true;this.savedMsg=''
        const sections=[]
        if(this.detailForm.showIngredients)sections.push('ingredients')
        if(this.detailForm.showHowToUse)sections.push('how_to_use')
        try{
          const r=await this.authFetch('/api/admin/products/'+this.prodDetail,{
            method:'PUT',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
              name:this.detailForm.name,description:this.detailForm.description,ingredients:this.detailForm.ingredients,
              how_to_use:this.detailForm.howToUse,sku:this.detailForm.sku,
              category_id:this.detailForm.categoryId,price:Number(this.detailForm.price)||0,
              cost_price:Number(this.detailForm.costPrice)||0,
              compare_at_price:Number(this.detailForm.comparePrice)||0,stock:Number(this.detailForm.stock)||0,
              low_stock_threshold:Number(this.detailForm.lowStock)||5,weight_grams:Number(this.detailForm.weight)*1000||0,
              is_active:this.detailForm.isActive,is_featured:this.detailForm.isFeatured,
              sections:sections.join(','),image_urls:this.detailImg?[this.detailImg]:[]
            })
          })
          const d=await r.json()
          if(d.success){
            this.detailSnapshot=JSON.parse(JSON.stringify(this.detailForm))
            this.hasUnsaved=false
            this.savedMsg='Saved!'
          }else{alert(d.error||'Save failed')}
        }catch(e){alert('Save error')}
        finally{this.saving=false;setTimeout(()=>{this.savedMsg=''},2000)}
      },
      revertProductDetail(){
        if(this.detailSnapshot){
          this.detailForm=JSON.parse(JSON.stringify(this.detailSnapshot))
          this.hasUnsaved=false
        }
      },
      async changeDetailImage(e){
        const f=e.target.files[0];if(!f)return
        if(f.size>10*1024*1024){alert('Image too large (max 10MB)');return}
        const fd=new FormData();fd.set('file',f)
        this.imgUploading=true;this.savedMsg=''
        try{
          const r=await this.authFetch('/api/admin/upload',{method:'POST',body:fd})
          const d=await r.json()
          if(d.success&&d.url){
            this.detailImg=d.url
            this.savedMsg='Image uploaded, saving...'
            await this.saveProductDetail()
          }else{alert(d.error||'Upload failed')}
        }catch(e){alert('Upload error: '+e.message)}
        finally{this.imgUploading=false}
      },
      async deleteProductDetail(){
        if(!confirm('Delete this product? This cannot be undone.'))return
        try{
          const r=await this.authFetch('/api/admin/products/'+this.prodDetail,{method:'DELETE'})
          const d=await r.json()
          if(d.success){
            this.prodDetail=null
            this.loadProducts()
          }else{alert(d.error||'Delete failed')}
        }catch(e){alert('Delete error: '+e.message)}
      },
      async toggleStatus(){
        const old=this.detailForm.isActive
        this._toggling=true
        this.detailForm.isActive=!old
        try{
          await this.authFetch('/api/admin/products/'+this.prodDetail+'/status',{
            method:'PATCH',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({is_active:this.detailForm.isActive})
          })
          this.detailSnapshot=JSON.parse(JSON.stringify(this.detailForm))
          this.hasUnsaved=false
          this._toggling=false
          this.loadProducts()
        }catch(e){this.detailForm.isActive=old;this._toggling=false;console.error(e)}
      },
      async toggleProductCard(id,btn){
        const isActive=btn.classList.contains('active');
        const newVal=!isActive;
        try{
          const r=await this.authFetch('/api/admin/products/'+id+'/status',{
            method:'PATCH',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({is_active:newVal})
          });
          const d=await r.json();
          if(d.success){
            if(newVal){btn.classList.remove('draft');btn.classList.add('active');btn.querySelector('.card-toggle-label').textContent='Published';btn.title='Published — click to unpublish'}
            else{btn.classList.remove('active');btn.classList.add('draft');btn.querySelector('.card-toggle-label').textContent='Draft';btn.title='Draft — click to publish'}
          }
        }catch(e){console.error(e)}
      },
      async toggleFeatured(){
        const old=this.detailForm.isFeatured
        this._toggling=true
        this.detailForm.isFeatured=!old
        try{
          await this.authFetch('/api/admin/products/'+this.prodDetail+'/status',{
            method:'PATCH',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({is_featured:this.detailForm.isFeatured})
          })
          this.detailSnapshot=JSON.parse(JSON.stringify(this.detailForm))
          this.hasUnsaved=false
          this._toggling=false
        }catch(e){this.detailForm.isFeatured=old;this._toggling=false;console.error(e)}
      },
      async duplicateProduct(id){
        try{
          const r=await this.authFetch('/api/admin/products/detail/'+id)
          const d=await r.json()
          this.form={
            name:(d.Name||'')+' (Copy)',description:d.Description||'',
            price:d.Price||0,costPrice:d.CostPrice||0,comparePrice:d.CompareAtPrice||0,sku:'',barcode:'',
            stock:0,lowStock:d.LowStockThreshold||5,weight:d.WeightGrams||0,
            brandId:d.BrandID||'',categoryId:d.CategoryID||'',
            ingredients:d.Ingredients||'',howToUse:d.HowToUse||'',
            showIngredients:d.Sections?.includes('ingredients')||false,
            showHowToUse:d.Sections?.includes('how_to_use')||false,
            isFeatured:false,
            images:(d.Images||[]).map(i=>i.url),isActive:true
          }
          this.editingProduct=null
          this.showProductForm=true
          this.loadBrands();this.loadCategories()
        }catch(e){console.error(e)}
      },
      async deleteProduct(id){
        if(!confirm('Delete this product? This cannot be undone.'))return
        try{
          const r=await this.authFetch('/api/admin/products/'+id,{method:'DELETE'})
          const d=await r.json()
          if(d.success)this.loadProducts()
          else alert(d.error||'Delete failed')
        }catch(e){alert('Delete error: '+e.message)}
      },
      async loadBrands(){
        try{const r=await this.authFetch('/api/admin/brands');const d=await r.json();this.brands=d.brands||[]}catch(e){}
      },
      async loadCategories(){
        try{const r=await this.authFetch('/api/admin/categories');const d=await r.json();this.categories=d.categories||[]}catch(e){}
      },
      async createBrand(){
        if(!this.newBrandName.trim())return
        this.addingBrand=true
        try{
          const r=await this.authFetch('/api/admin/brands',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:this.newBrandName.trim()})})
          const d=await r.json()
          if(d.success||d.id){
            this.newBrandName='';this.showNewBrand=false
            await this.loadBrands()
            this.form.brandId=d.id
          }else{alert(d.error||'Failed')}
        }catch(e){alert('Error creating brand')}
        finally{this.addingBrand=false}
      },
      async createCategory(){
        if(!this.newCatName.trim())return
        this.addingCat=true
        try{
          const r=await this.authFetch('/api/admin/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:this.newCatName.trim()})})
          const d=await r.json()
          if(d.success||d.id){
            this.newCatName='';this.showNewCat=false
            await this.loadCategories()
            this.form.categoryId=d.id
          }else{alert(d.error||'Failed')}
        }catch(e){alert('Error creating category')}
        finally{this.addingCat=false}
      },

      async handleDrop(e){
        this.handleFiles(e.dataTransfer.files)
      },

      async handleFiles(files){
        for(const f of files){
          if(f.size>10*1024*1024){alert('Image too large (max 10MB): '+f.name);continue}
          if(!['image/jpeg','image/png','image/webp'].includes(f.type)&&!f.name.match(/\.(jpg|jpeg|png|webp)$/i)){alert('Only JPG, PNG, WebP allowed: '+f.name);continue}
          this.uploading=true;this.uploadProgress=0
          const fd=new FormData();fd.set('file',f)
          try{
            const r=await this.authFetch('/api/admin/upload',{method:'POST',body:fd})
            const d=await r.json()
            if(d.success&&d.url){this.form.images.push(d.url)}
            else{alert(d.error||'Upload failed')}
          }catch(e){alert('Upload error: '+e.message)}
        }
        this.uploading=false;this.uploadProgress=100
      },
      loadCustomers(){
        const p=new URLSearchParams({page:this.custPage,limit:20})
        if(this.custSearch)p.set('search',this.custSearch)
        this.authFetch('/api/admin/customers?'+p).then(r=>r.json()).then(d=>{
          this.renderCustomers(d.customers||[])
          this.custTotal=d.total||0
          this.renderPages('customers-pages',d.total,d.page,d.limit,(pg)=>{this.custPage=pg;this.loadCustomers()})
        })
      },
      renderCustomers(c){
        const b=document.getElementById('customers-body')
        if(!b)return
        if(!c.length){b.innerHTML='<tr><td colspan="7"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>No customers found</p></div></td></tr>';return}
        b.innerHTML=c.map(x=>`<tr><td><strong>${x.first_name} ${x.last_name}</strong></td><td>${x.email}</td><td>${x.phone}</td><td>${x.total_orders}</td><td><strong>DA ${x.lifetime.toLocaleString()}</strong></td><td><span style="font-weight:600;color:${x.risk_score>6?'#dc2626':x.risk_score>3?'#d97706':'#059669'}">${x.risk_score}</span></td><td style="color:var(--text-muted);font-size:12px">${x.last_order?new Date(x.last_order).toLocaleDateString():'-'}</td></tr>`).join('')
      },
      renderPages(id,total,page,limit,onClick){
        const el=document.getElementById(id)
        if(!el)return
        const pages=Math.ceil(total/limit)
        if(pages<=1){el.innerHTML='';return}
        let h='<span class="page-info">'+total+' total</span>'
        h+=`<button class="page-btn" ${page<=1?'disabled':''} data-p="${page-1}">&lsaquo;</button>`
        const s=Math.max(1,page-2),e=Math.min(pages,page+2)
        if(s>1)h+=`<button class="page-btn" data-p="1">1</button>${s>2?'<span class="page-info">...</span>':''}`
        for(let i=s;i<=e;i++)h+=`<button class="page-btn ${i===page?'active':''}" data-p="${i}">${i}</button>`
        if(e<pages)h+=`${e<pages-1?'<span class="page-info">...</span>':''}<button class="page-btn" data-p="${pages}">${pages}</button>`
        h+=`<button class="page-btn" ${page>=pages?'disabled':''} data-p="${page+1}">&rsaquo;</button>`
        el.innerHTML=h
        el.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled)onClick(parseInt(b.dataset.p))}))
      },
      loadNotifs(){
        Promise.all([
          this.authFetch('/api/admin/dashboard').then(r=>r.json()).catch(()=>({})),
          this.authFetch('/api/admin/orders?status=pending&limit=3').then(r=>r.json()).catch(()=>({})),
          this.authFetch('/api/admin/orders?status=cancelled&limit=3').then(r=>r.json()).catch(()=>({}))
        ]).then(([dash, pend, canc])=>{
          const items=[]
          const alerts=dash.alerts||[]
          alerts.forEach(a=>{
            if(a.type==='low_stock') items.push({id:'ls-'+Math.random(),type:'low_stock',title:a.message,created_at:new Date().toISOString(),is_read:false})
          })
          if(dash.kpi?.pendingOrders>0) items.push({id:'po',type:'order',title:dash.kpi.pendingOrders+' pending order'+(dash.kpi.pendingOrders>1?'s':''),created_at:new Date().toISOString(),is_read:false})
          ;(pend.orders||[]).forEach(o=>items.push({id:'o-'+o.id,type:'order',title:'Order #'+o.order_number+' is pending — DA '+o.total.toLocaleString(),created_at:o.created_at,is_read:false}))
          ;(canc.orders||[]).forEach(o=>items.push({id:'c-'+o.id,type:'cancelled',title:'Order #'+o.order_number+' was cancelled',created_at:o.created_at,is_read:false}))
          items.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))
          this.notifications=items.slice(0,20)
          this.unreadCount=items.filter(n=>!n.is_read).length
        }).catch(()=>{})
      },
      async loadStoreInfo(){
        try{
          const r=await fetch('/api/store-info')
          if(r.ok){const d=await r.json();this.storeInfo={store_name:d.store_name||'',store_description:d.store_description||'',owner_name:d.owner_name||'',phone:d.phone||'',location:d.location||'',location_link:d.location_link||'',instagram:d.instagram||'',tiktok:d.tiktok||'',images:d.images||[]}}
        }catch(e){console.error(e)}
      },
      async saveStoreInfo(){
        this.storeSaving=true;this.storeSavedMsg=''
        try{
          const body=JSON.stringify({store_name:this.storeInfo.store_name,store_description:this.storeInfo.store_description,owner_name:this.storeInfo.owner_name,phone:this.storeInfo.phone,location:this.storeInfo.location,location_link:this.storeInfo.location_link,instagram:this.storeInfo.instagram,tiktok:this.storeInfo.tiktok,images:this.storeInfo.images})
          const r=await this.authFetch('/api/admin/store-info',{method:'PUT',headers:{'Content-Type':'application/json'},body})
          const d=await r.json()
          if(d.success){this.storeSavedMsg='Saved!'}else{alert(d.error||'Save failed')}
        }catch(e){alert('Save error: '+e.message)}
        finally{this.storeSaving=false;setTimeout(()=>{this.storeSavedMsg=''},2000)}
      },
      async handleStoreDrop(e){
        this.handleStoreFiles(e.dataTransfer.files)
      },
      async handleStoreFiles(files){
        for(const f of files){
          if(!f.type.startsWith('image/'))continue
          this.storeUploading=true;this.storeUploadProgress=0
          const fd=new FormData();fd.set('file',f)
          try{
            const r=await this.authFetch('/api/admin/upload',{method:'POST',body:fd})
            const d=await r.json()
            if(d.success&&d.url){this.storeInfo.images.push(d.url)}
          }catch(e){console.error(e)}
        }
        this.storeUploading=false;this.storeUploadProgress=100
      },
      async loadPacks(){
        try{
          const r=await this.authFetch('/api/admin/packs')
          if(r.ok)this.packs=await r.json()
        }catch(e){console.error(e)}
      },
      editPack(p){
        this.packForm={name:p.name,description:p.description,price:p.price,image:p.image||'',days_valid:p.days_valid}
        this.packEditingId=p.id;this.packShowForm=true
      },
      async savePack(){
        this.packSaving=true
        try{
          const body=JSON.stringify({name:this.packForm.name,description:this.packForm.description,price:Number(this.packForm.price),image:this.packForm.image,days_valid:Number(this.packForm.days_valid)})
          const isEdit=!!this.packEditingId
          const r=await this.authFetch('/api/admin/packs'+(isEdit?'/'+this.packEditingId:''),{method:isEdit?'PUT':'POST',headers:{'Content-Type':'application/json'},body})
          const d=await r.json()
          if(d.success||d.id){this.packShowForm=false;this.loadPacks()}
          else{alert(d.error||'Save failed')}
        }catch(e){alert('Save error: '+e.message)}
        finally{this.packSaving=false}
      },
      async deletePack(id){
        if(!confirm('Delete this pack?'))return
        try{
          const r=await this.authFetch('/api/admin/packs/'+id,{method:'DELETE'})
          const d=await r.json()
          if(d.success)this.loadPacks()
          else alert(d.error||'Delete failed')
        }catch(e){alert('Delete error: '+e.message)}
      },
      async handlePackUpload(files){
        const f=files[0]
        if(!f||!f.type.startsWith('image/'))return
        this.packUploading=true
        this.packUploadProgress=0
        try{
          const fd=new FormData();fd.set('file',f)
          const r=await this.authFetch('/api/admin/upload',{method:'POST',body:fd})
          const d=await r.json()
          if(d.success&&d.url)this.packForm.image=d.url
        }catch(e){console.error(e)}
        finally{this.packUploading=false;this.packUploadProgress=0}
      },
      handlePackFiles(files){this.handlePackUpload(files)},
      handlePackDrop(e){this.handlePackUpload(e.dataTransfer.files)},
      logout(){
        localStorage.removeItem('admin_token');
        window.location.href='/admin-login.html'
      }
    }
  }
</script>
</body>
</html>
